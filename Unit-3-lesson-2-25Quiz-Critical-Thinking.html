ने"],correct:1,explanation:"पहेंलो टोपी आशावादी सोच हो – यसले कुनै विचारमा के राम्रो छ, के फाइदा हुन्छ भनेर खोज्छ।"},{id:7,question:"हरियो टोपी (Green Hat) ले कुन सोचलाई जनाउँछ?",options:["सिर्जनात्मक, नयाँ विकल्प र वैकल्पिक विचार","तथ्यपरक र वस्तुनिष्ठ","भावनात्मक र संवेदनशील","नियन्त्रण र व्यवस्थापन"],correct:0,explanation:"हरियो टोपी सृजनाको प्रतीक हो – नयाँ आइडिया, विकल्प, आविष्कार र Lateral Thinking यसैमा पर्छ।"},{id:8,question:"निलो टोपी (Blue Hat) को मुख्य कार्य के हो?",options:["सोच प्रक्रियाको व्यवस्थापन, एजेन्डा तय र निष्कर्ष निकाल्ने","भावना व्यक्त गर्ने","तथ्य मात्र दिने","आलोचना गर्ने"],correct:0,explanation:"निलो टोपी मेटाकग्निटिभ हो – सोचलाई नियन्त्रण गर्ने, सबै टोपीको प्रयोग मिलाउने र अन्तिम निष्कर्षमा पुग्ने टोपी।"},{id:9,question:"ब्लुमको ट्याक्सोनोमी अनुसार समालोचनात्मक चिन्तन कुन तहसँग बढी सम्बन्धित छ?",options:["सम्झने र बुझ्ने मात्र","विश्लेषण, मूल्यांकन र सिर्जना जस्ता उच्च तह","केवल प्रयोग","केवल सम्झने"],correct:1,explanation:"ब्लुमको उच्च तह – Analyse, Evaluate, Create – नै समालोचनात्मक चिन्तनको केन्द्र हो।"},{id:10,question:"समालोचनात्मक चिन्तनमा कुन सीप पर्दैन?",options:["विश्लेषण र व्याख्या","मूल्यांकन र तार्किकता","अन्धविश्वासमा विश्वास र हतारमा निष्कर्ष","निष्पक्षता र खुलेपन"],correct:2,explanation:"अन्धविश्वास, पूर्वाग्रह र हतारको निष्कर्ष समालोचनात्मक चिन्तनको बाधक हो, सीप होइन।"},{id:11,question:"कुनै सूचनालाई स्वीकार गर्नु अघि स्रोत, प्रमाण र उद्देश्य जाँच्नु कुन सीप हो?",options:["सिर्जनात्मक चिन्तन","समालोचनात्मक चिन्तन","नकारात्मक चिन्तन","दिवास्वप्न"],correct:1,explanation:"स्रोतको विश्वसनीयता, प्रमाणको गुणस्तर र लेखकको उद्देश्य जाँच्नु नै समालोचनात्मक चिन्तनको आधार हो।"},{id:12,question:"Confirmation Bias भनेको के हो?",options:["आफ्नो मान्यतासँग मिल्ने सूचना मात्र खोज्ने र नमिल्ने बेवास्ता गर्ने प्रवृत्ति","सबै प्रमाण बराबर मूल्यांकन गर्ने","नयाँ विचार सजिलै स्वीकार्ने","तटस्थ र निष्पक्ष रहने"],correct:0,explanation:"Confirmation Bias ले हामीलाई आफूलाई मनपर्ने कुरा मात्र सत्य लाग्ने भ्रममा पार्छ, जुन समालोचनात्मक चिन्तनले हटाउँछ।"},{id:13,question:"समालोचनात्मक चिन्तनको प्रमुख बाधा कुन हो?",options:["जिज्ञासा र खुलेपन","अहंकार, पूर्वाग्रह, भावनात्मक आवेग र गलत सूचना","तर्क र प्रमाण खोज्ने बानी","प्रश्न सोध्ने बानी"],correct:1,explanation:"अहंकार, इमोसन, स्टेरियोटाइप, अफवाह र सामाजिक दबाबले समालोचनात्मक सोचलाई रोक्छ।"},{id:14,question:"बलियो तर्क (Strong Argument) मा के-के हुनुपर्छ?",options:["दाबी (Claim) + प्रमाण (Evidence) + तर्कसंगति (Reasoning)","केवल भावना र नारा","केवल ठूलो स्वर","केवल अनुमान"],correct:0,explanation:"राम्रो तर्कमा स्पष्ट दाबी, त्यसलाई पुष्टि गर्ने विश्वसनीय प्रमाण र प्रमाणलाई दाबीसँग जोड्ने तर्कसंगति हुनुपर्छ।"},{id:15,question:"तथ्य (Fact) र धारणा (Opinion) बीचको भिन्नता छुट्याउन सक्नु कुन चिन्तन हो?",options:["समालोचनात्मक चिन्तन","भावनात्मक चिन्तन","स्वचालित चिन्तन","कुनै पनि होइन"],correct:0,explanation:"तथ्य प्रमाणित गर्न सकिन्छ, धारणा व्यक्तिगत विश्वास हो। यो छुट्याउनु समालोचनात्मक साक्षरताको पहिलो पाइला हो।"},{id:16,question:"कुन प्रश्न समालोचनात्मक चिन्तनसँग मेल खाँदैन?",options:["यसको प्रमाण के हो?","यसको स्रोत विश्वसनीय छ?","सबैले भनेकै सत्य हो?","अर्को विकल्प वा दृष्टिकोण के हुन सक्छ?"],correct:2,explanation:"‘सबैले भनेको सत्य’ भन्नु Bandwagon fallacy हो। समालोचनात्मक चिन्तकले भीड होइन, प्रमाण हेर्छ।"},{id:17,question:"जीवनोपयोगी सीपमा समालोचनात्मक चिन्तन किन आवश्यक छ?",options:["सही निर्णय, समस्या समाधान र जिम्मेवार नागरिक बन्न","अरुलाई दोष दिन सजिलो बनाउन","विवाद र झगडा बढाउन","समय बिताउन मात्र"],correct:0,explanation:"जीवनका दैनिक निर्णय, स्वास्थ्य, वित्त, सम्बन्ध र करियरमा सही छनौट गर्न समालोचनात्मक चिन्तन अनिवार्य छ।"},{id:18,question:"मिडिया साक्षरता र समालोचनात्मक चिन्तनको सम्बन्ध कस्तो छ?",options:["मिडियामा जे आयो त्यही पत्याउने","मिडियाका सूचनाको सत्यता, पक्षपात, उद्देश्य र प्रमाण विश्लेषण गर्ने","मिडिया कहिल्यै नहेर्ने","कुनै सम्बन्ध छैन"],correct:1,explanation:"फेक न्यूज, क्लिकबेट र प्रोपागान्डाबाट बच्न मिडिया साक्षरतामा समालोचनात्मक चिन्तन सबैभन्दा ठूलो हतियार हो।"},{id:19,question:"Socratic Questioning भनेको के हो?",options:["गहिरो, क्रमबद्ध प्रश्न सोधेर सोचलाई स्पष्ट, तार्किक र गहिरो बनाउने विधि","उत्तर घोकेर भन्ने विधि","प्रश्न नसोध्ने विधि","अनुमान गर्ने विधि"],correct:0,explanation:"सुकरातले जस्तै ‘किन? कसरी? प्रमाण के? यदि विपरीत भयो भने?’ जस्ता प्रश्नले सोचलाई खार्छ।"},{id:20,question:"समालोचनात्मक चिन्तकको विशेषता कुन होइन?",options:["जिज्ञासु र प्रश्न सोध्ने","खुला मन र नम्रता","प्रमाण खोज्ने र निष्पक्ष","हतारमा निष्कर्षमा पुग्ने र भावनामा बग्ने"],correct:3,explanation:"हतारको निष्कर्ष, भावनात्मक आवेग र पुष्टिकरण पक्षपात समालोचनात्मक चिन्तकले बेवास्ता गर्छ।"},{id:21,question:"साथीले भन्यो – 'सामाजिक सञ्जालमा जे देखिन्छ त्यही सत्य हो।' समालोचनात्मक प्रतिक्रिया कुन होला?",options:["हो, सबै सत्य हुन्छ, सिधै शेयर गरौँ","स्रोत, प्रमाण, मिति र तथ्य जाँचौँ, फेक न्यूज हुन सक्छ","मलाई मतलब छैन","रिसाएर झगडा गरौँ"],correct:1,explanation:"समालोचनात्मक चिन्तकले भेरिफाई नगरी शेयर गर्दैन – स्रोत, तस्बिरको सत्यता, रिभर्स सर्च गर्छ।"},{id:22,question:"समस्या समाधानमा समालोचनात्मक चिन्तनको पहिलो पाइला के हो?",options:["समस्या स्पष्ट रूपमा परिभाषित र विश्लेषण गर्ने","सिधै समाधान लागू गर्ने","अरुलाई दोष दिने","समस्या बेवास्ता गर्ने"],correct:0,explanation:"समस्या के हो? किन भयो? कसलाई असर गर्यो? नबुझी समाधान खोज्नु अन्धो दौड हो।"},{id:23,question:"Inductive र Deductive तर्कमा के फरक छ?",options:["Inductive विशेषबाट सामान्यमा, Deductive सामान्य सिद्धान्तबाट विशेष निष्कर्षमा जान्छ","दुवै एउटै हो","तर्कसँग सम्बन्ध छैन","Inductive भावनात्मक हो, Deductive तार्किक हो"],correct:0,explanation:"Inductive: धेरै उदाहरणबाट नियम बनाउने। Deductive: नियमबाट विशिष्ट घटना प्रमाणित गर्ने। दुवै समालोचनात्मक सोचमा चाहिन्छ।"},{id:24,question:"समालोचनात्मक चिन्तनले कस्तो नागरिक बनाउँछ?",options:["सचेत, तार्किक, जिज्ञासु र जिम्मेवार नागरिक","अन्धभक्त र अफवाह पत्याउने नागरिक","निष्क्रिय र उदासीन नागरिक","अफवाह फैलाउने नागरिक"],correct:0,explanation:"समालोचनात्मक नागरिकले अधिकार, कर्तव्य, संविधान र सूचनालाई तर्कसंगत रूपमा बुझ्छ र प्रश्न गर्छ।"},{id:25,question:"जीवनमा समालोचनात्मक चिन्तन प्रयोग गर्ने उत्तम तरिका कुन हो?",options:["हरेक
