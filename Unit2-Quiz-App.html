ोकन गरी सङ्कलन गरेको वास्तविक तथ्याङ्कलाई के भनिन्छ?",options:{क:"प्राथमिक स्रोत (Primary Source)",ख:"द्वितीयक स्रोत (Secondary Source)",ग:"इन्टरनेट स्रोत",घ:"पादटिप्पणी स्रोत"},correct:"क",lesson:"अनुसन्धान परिचय"},{id:7,text:"अरू कुनै व्यक्ति वा संस्थाले पहिले नै सङ्कलन र प्रकाशन गरिसकेका पुस्तक, सरकारी प्रतिवेदन, पत्रपत्रिका वा इन्टरनेटबाट प्राप्त हुने तथ्याङ्क कुन स्रोतअन्तर्गत पर्दछ?",options:{क:"प्राथमिक स्रोत",ख:"द्वितीयक स्रोत (Secondary Source)",ग:"प्रत्यक्ष स्रोत",घ:"मौलिक स्रोत"},correct:"ख",lesson:"अनुसन्धान परिचय"},{id:8,text:"प्राथमिक स्रोतबाट तथ्याङ्क सङ्कलन गर्दा देखिने मुख्य चुनौती वा सीमा कुन हो?",options:{क:"यो स्रोतबाट प्राप्त तथ्याङ्क अप्रमाणित र पुराना हुन्छन्।",ख:"यसमा बढी समय, ठुलो श्रम र बढी आर्थिक लगानी खर्च हुन्छ।",ग:"यसमा अनुसन्धानकर्ताले आफैँ सङ्कलन गर्न पाउँदैन।",घ:"यो सजिलै पुस्तकालयमा मात्र बसेर प्राप्त गर्न सकिन्छ।"},correct:"ख",lesson:"अनुसन्धान परिचय"},{id:9,text:"तलका मध्ये कुन चाहिँ द्वितीयक स्रोत (Secondary Source) को सबल पक्ष वा फाइदा हो?",options:{क:"यो सधैँ शतप्रतिशत त्रुटिरहित र नयाँ हुन्छ।",ख:"यसमा अनुसन्धानकर्ताको व्यक्तिगत पूर्वाग्रह पूर्ण रूपमा शून्य हुन्छ।",ग:"यो तुलनात्मक रूपमा सस्तो, सजिलो र छिटो प्राप्त गर्न सकिन्छ।",घ:"यसका लागि फिल्डमा गएर अन्तर्वार्ता लिनैपर्ने हुन्छ।"},correct:"ग",lesson:"अनुसन्धान परिचय"},{id:10,text:"अनुसन्धान प्रक्रियामा प्राथमिक र द्वितीयक तथ्याङ्कबीच कस्तो सम्बन्ध रहन्छ?",options:{क:"यी दुईबीच कुनै सम्बन्ध हुँदैन र एकअर्काका विरोधी हुन्।",ख:"एउटा अनुसन्धानमा कुनै एक स्रोत मात्र प्रयोग गर्न मिल्छ, दुवै मिल्दैन।",ग:"यी दुई स्रोतहरू एकअर्काका परिपूरक हुन् र दुवैको आ-आफ्नै महत्त्व छ।",घ:"द्वितीयक स्रोत प्रयोग गरेपछि प्राथमिक स्रोतको महत्त्व स्वतः समाप्त हुन्छ।"},correct:"ग",lesson:"अनुसन्धान परिचय"},{id:11,text:"तथ्याङ्क र सूचनाको परिचयका सन्दर्भमा 'कुन पर्दैन' (Which does not belong) पहिचान गर्नुहोस्:",options:{क:"तथ्य, शब्द, वाक्य, चित्र र सङ्केतहरू तथ्याङ्क र सूचना हुन्।",ख:"गुणात्मक तथ्याङ्कलाई सजिलै गणितीय औसत (Mean) निकालेर विश्लेषण गर्न सकिन्छ।",ग:"परिमाणात्मक तथ्याङ्कलाई सङ्ख्यामा व्यक्त गर्न सकिन्छ।",घ:"जनगणना, प्रतिवेदन र इन्टरनेट द्वितीयक स्रोतका उदाहरण हुन्।"},correct:"ख",lesson:"अनुसन्धान परिचय"},{id:12,text:"अनुसन्धानमा प्रयोग हुने 'चर' (Variable) भन्नाले के बुझिन्छ?",options:{क:"सधैँ स्थिर रहने र कहिल्यै परिवर्तन नहुने गणितीय सङ्ख्या",ख:"अनुसन्धानकर्ताले मापन गर्न चाहेको कुनै व्यक्ति, वस्तु, स्थान, अवस्था वा प्रक्रियासँग सम्बन्धित परिवर्तनशील गुण",ग:"केवल कम्प्युटर सफ्टवेयरमा मात्र रहने कोडिङ विन्डोज",घ:"अनुसन्धान प्रस्तावनामा लेखिने सन्दर्भ सामग्रीको सूची"},correct:"ख",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:13,text:"कुनै निश्चित क्षेत्रमा 'धानको उत्पादन' बढाउन वा घटाउन 'वर्षाको मात्रा' ले प्रभाव पार्छ भने, यस उदाहरणमा 'धानको उत्पादन' कुन चर हो?",options:{क:"स्वतन्त्र चर (Independent Variable)",ख:"निर्भर वा आश्रित चर (Dependent Variable)",ग:"मध्यवर्ती चर (Intervening Variable)",घ:"नियन्त्रित चर"},correct:"ख",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:14,text:"दुई वा दुईभन्दा बढी चरहरूबीचको आपसी सम्बन्ध वा पारस्परिक झुकावलाई गणितीय रूपमा मापन गर्ने अवधारणालाई के भनिन्छ?",options:{क:"कार्यकारण सम्बन्ध (Causality)",ख:"सहसम्बन्ध (Correlation)",ग:"कोडीकरण (Coding)",घ:"प्रस्तावना (Proposal)"},correct:"ख",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:15,text:"सहसम्बन्ध सूचकाङ्क (Correlation Index) को मान कुन दायराभित्र मापन गरिन्छ?",options:{क:"-१.० देखि +१.० सम्म (वा सामान्यतया ०.० देखि १.० को सूचकाङ्कमा)",ख:"-१०० देखि +१०० सम्म",ग:"केवल सकारात्मक १ देखि १० को पूर्णाङ्कमा",घ:"० देखि १०० को प्रतिशत दायरामा"},correct:"क",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:16,text:"यदि सहसम्बन्ध सूचकाङ्कको मान ०.१ देखि ०.४ सम्म छ भने त्यसलाई कस्तो सहसम्बन्ध मानिन्छ?",options:{क:"सबल वा बलियो सहसम्बन्ध (Strong)",ख:"मध्यम सहसम्बन्ध (Moderate)",ग:"कमजोर सहसम्बन्ध (Weak)",घ:"पूर्ण वा आदर्श सहसम्बन्ध"},correct:"ग",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:17,text:"यदि एउटा स्वतन्त्र चर बढ्दा निर्भर चर पनि बढ्छ र स्वतन्त्र चर घट्दा निर्भर चर पनि घट्छ भने त्यस्तो सम्बन्धलाई के भनिन्छ?",options:{क:"नकारात्मक सहसम्बन्ध",ख:"सकारात्मक सहसम्बन्ध (Positive Correlation)",ग:"शून्य सहसम्बन्ध",घ:"कार्यकारण सम्बन्ध"},correct:"ख",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:18,text:"विद्यार्थीको 'उमेर बढ्दा' उसको 'प्राथमिक कक्षाको प्राप्ताङ्क घट्छ' वा उल्टो दिशामा प्रभाव देखिन्छ भने यो कुन सहसम्बन्धको उदाहरण हो?",options:{क:"सकारात्मक सहसम्बन्ध",ख:"नकारात्मक सहसम्बन्ध (Negative Correlation)",ग:"शून्य सहसम्बन्ध",घ:"पूर्ण सकारात्मक सहसम्बन्ध"},correct:"ख",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:19,text:"'वर्षा बढी वा कम हुनु' र 'किसानको उमेर' बीचको सम्बन्ध कस्तो सहसम्बन्ध हो?",options:{क:"सकारात्मक सहसम्बन्ध",ख:"नकारात्मक सहसम्बन्ध",ग:"शून्य सहसम्बन्ध (Zero Correlation)",घ:"मध्यम सहसम्बन्ध"},correct:"ग",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:20,text:"एउटा चर वा घटनामा परिवर्तन आउनाले अनिवार्य रूपमा अर्को चर वा घटनामा परिवर्तन ल्याउँछ र त्यसको पछाडि स्पष्ट कारण हुन्छ भने त्यसलाई के भनिन्छ?",options:{क:"केवल सहसम्बन्ध",ख:"शून्य सहसम्बन्ध",ग:"कार्यकारण सम्बन्ध (Causality / Cause-and-Effect Relationship)",घ:"कोडीकरण प्रक्रिया"},correct:"ग",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:21,text:"सहसम्बन्ध र कार्यकारण सम्बन्धबीचको सम्बन्धका बारेमा तलका मध्ये कुन भनाइ सत्य छ?",options:{क:"सबै प्रकारका सहसम्बन्धहरू स्वतः कार्यकारण सम्बन्ध हुन्।",ख:"कार्यकारण सम्बन्ध भएका चरहरूमा सहसम्बन्ध हुन सक्दैन।",ग:"सबै प्रकारका सहसम्बन्धहरू कार्यकारण सम्बन्ध हुँदैनन्, तर कार्यकारण सम्बन्ध हुनका लागि सहसम्बन्ध हुनु अनिवार्य छ।",घ:"यी दुईवटा अवधारणा पूर्ण रूपमा एउटै हुन्, कुनै भिन्नता छैन।"},correct:"ग",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:22,text:"सहसम्बन्ध सूचकाङ्कमा 'मध्यम सहसम्बन्ध' (Moderate Correlation) को दायरा कुन हो?",options:{क:"०.० देखइ ०.१ सम्म",ख:"०.१ देखि ०.४ सम्म",ग:"०.४ देखि ०.७ सम्म",घ:"०.७ देखि १.० सम्म"},correct:"ग",lesson:"सहसम्बन्ध तथा कार्यकारण सम्बन्धको अवधारणा"},{id:23,text:"कुनै पनि अनुसन्धान कार्य सुरु गर्नुभन्दा अगाडि गरिने योजना, खाका वा स्वीकृतिका लागि पेस गरिने लिखित दस्तावेजलाई के भनिन्छ?",options:{क:"अनुसन्धान प्रतिवेदन (Research Report)",ख:"अध्ययन प्रस्तावना (Research Proposal)",ग:"सन्दर्भ सामग्री (References)",घ:"साहित्य पुनरावलोकन (Literature Review)"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:24,text:"अध्ययन प्रस्तावनाको संरचनामा नपर्ने वा 'यसको मुख्य अङ्ग नभएको' विकल्प कुन हो?",options:{क:"समस्याको कथन (Statement of the Problem)",ख:"उद्देश्यहरू (Objectives)",ग:"प्रतिवेदनको अन्तिम नतिजा र विश्लेषण (Final Findings & Discussion)",घ:"साहित्य पुनरावलोकन (Literature Review)"},correct:"ग",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:25,text:"प्रस्तावनाको 'परिचय' (Introduction) खण्डमा मुख्य रूपमा के लेखिन्छ?",options:{क:"अनुसन्धान गरिने विषयको पृष्ठभूमि, यसको क्षेत्र र औचित्यको सैद्धान्तिक उठान",ख:"अनुसन्धानमा प्रयोग गरिने प्रश्नावलीको सूची",ग:"नेपाल सरकारको प्रतिलिपि अधिकार ऐनका दफाहरू",घ:"माइक्रोसफ्ट एक्सेलमा जोडघटाउ गर्ने तरिका"},correct:"क",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:26,text:"अनुसन्धानले के-के कुराहरू पत्ता लगाउने लक्ष्य राखेको छ भनी स्पष्ट रूपमा तोकिएका बुँदाहरूलाई प्रस्तावनाको कुन अङ्ग मानिन्छ?",options:{क:"परिचय",ख:"उद्देश्यहरू (Objectives)",ग:"अध्ययन विधि",घ:"सन्दर्भ सामग्री"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:27,text:"प्रस्तावनामा 'साहित्य पुनरावलोकन' (Literature Review) किन गरिन्छ?",options:{क:"साहित्यिक कविता र उपन्यासहरूको संक्षेप लेख्न",ख:"सम्बन्धित क्षेत्रमा पहिले नै भएका अनुसन्धान, पुस्तक र लेखहरूको अध्ययन गरी ज्ञानको रिक्तता (Knowledge Gap) पत्ता लगाउन",ग:"अनुसन्धानको बजेट र खर्चको हिसाब मिलान गर्न",घ:"तथ्याङ्क प्रशोधन गर्नका लागि सफ्टवेयर खरिद गर्न"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:28,text:"तथ्याङ्क कसरी सङ्कलन गर्ने, कुन साधन प्रयोग गर्ने र तथ्याङ्कको विश्लेषण कसरी गर्ने भन्ने योजना प्रस्तावनाको कुन खण्डमा प्रस्तुत गरिन्छ?",options:{क:"समस्याको कथन",ख:"साहित्य पुनरावलोकन",ग:"अध्ययन विधि (Research Methodology)",घ:"सन्दर्भ सामग्री"},correct:"ग",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:29,text:"अध्ययन प्रस्तावना वा प्रतिवेदनको अन्त्यमा प्रस्तावना तयार पार्दा सहयोग लिइएका विभिन्न बाह्य पुस्तक, लेख वा वेबसाइटहरूको सूची राख्ने खण्डलाई के भनिन्छ?",options:{क:"पादटिप्पणी (Footnote)",ख:"सन्दर्भ सामग्री (References)",ग:"प्रस्तावनाको औचित्य",घ:"प्राविधिक शब्दकोश"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:30,text:"पाठ्यपुस्तकमा प्रस्तुत गरिएको 'काभ्रेपलाञ्चोक जिल्लाको बनेपा नगरको ऐतिहासिक अध्ययनको प्रस्तावना' मा कस्तो अध्ययन विधिको प्रस्ताव गरिएको छ?",options:{क:"विशुद्ध परिमाणात्मक सर्वेक्षण विधि",ख:"गुणात्मक अनुसन्धान विधि (Qualitative Research Method)",ग:"प्रयोगशालामा गरिने प्रयोगात्मक विधि",घ:"माइक्रोसफ्ट एक्सेलको साङ्ख्यिकीय विश्लेषण विधि"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:31,text:"बनेपा नगरको ऐतिहासिक अध्ययनको प्रस्तावनाअनुसार प्राथमिक तथ्याङ्क सङ्कलनका लागि मुख्य कुन विधिको प्रयोग गर्ने योजना छ?",options:{क:"गुगल फारमबाट हजारौँ मानिसमा पठाइने प्रश्नावली",ख:"स्थलगत भ्रमण, फोटो सङ्कलन र स्थानीय प्रमुख व्यक्तिहरूसँग अन्तर्वार्ता",ग:"राष्ट्रिय योजना आयोगको पुस्तकको हुबहु कपी",घ:"बजारबाट प्राप्त नाफा नोक्सानको एक्सेल हिसाब"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:32,text:"प्रस्तावनामा 'समस्याको कथन' (Statement of the Problem) किन महत्त्वपूर्ण छ?",options:{क:"यसले अनुसन्धानमा हुने सम्पूर्ण आर्थिक खर्चको विवरण दिन्छ।",ख:"यसले अनुसन्धान गर्न लागिएको मुख्य द्विविधा, प्रश्न वा समस्यालाई स्पष्ट रूपमा प्रस्तुत गर्छ।",ग:"यसले सन्दर्भ सामग्रीको वर्णानुक्रम मिलाउँछ।",घ:"यसले सफ्टवेयरको इजाजतपत्र प्रमाणित गर्दछ।"},correct:"ख",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:33,text:"प्रस्तावना लेखनको सन्दर्भमा 'कुन भनाइ गलत छ' (Which does not belong) पहिचान गर्नुहोस्:",options:{क:"प्रस्तावना सधैँ अनुसन्धान कार्य सम्पन्न भइसकेपछि मात्र लेखिन्छ।",ख:"प्रस्तावनामा बजेट र समयको कार्यतालिका पनि समावेश गर्न सकिन्छ।",ग:"उद्देश्यहरूले अनुसन्धानको बाटो र सीमा निर्धारण गर्छन्।",घ:"साहित्य पुनरावलोकनले अनुसन्धानमा हुनुपर्ने मौलिकता जोगाउन मद्दत गर्छ।"},correct:"क",lesson:"अध्ययन प्रस्तावनाको संरचना"},{id:34,text:"अरू कुनै व्यक्तिको विचार, लेख, रेखाचित्र, तथ्याङ्क वा बौद्धिक कार्यलाई उसको अनुमति विना वा स्रोतको उल्लेख नगरी आफ्नै दाबी गरेर प्रकाशन वा प्रस्तुत गर्ने कार्यलाई के भनिन्छ?",options:{क:"प्रतिलिपि अधिकार (Copyright)",ख:"बौद्धिक चोरी (Plagiarism)",ग:"पादटिप्पणी लेखन",घ:"पुनर्कथन (Paraphrasing)"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:35,text:"बौद्धिक चोरी (Plagiarism) कुन अधिकारको गम्भीर उल्लङ्घन हो?",options:{क:"मानव अधिकार",ख:"बौद्धिक सम्पत्ति अधिकार (Intellectual Property Rights)",ग:"राजनीतिक स्वतन्त्रताको अधिकार",घ:"गोपनीयताको अधिकार"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:36,text:"बौद्धिक चोरीका मुख्य प्रकारहरू कुन-कुन हुन्?",options:{क:"प्राथमिक र द्वितीयक चोरी",ख:"जानाजानी गरिने चोरी (Intentional) र अन्जानमा गरिने चोरी (Accidental)",ग:"शाब्दिक र अशाब्दिक चोरी",घ:"कानुनी र गैरकानुनी चोरी"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:37,text:"तलका मध्ये कुन चाहिँ 'जानाजानी गरिने बौद्धिक चोरी' (Intentional Plagiarism) को उदाहरण हो?",options:{क:"लापरबाही तरिकाले गर्दा स्रोत उल्लेख गर्न छुट्नु",ख:"अरूको पूरै लेख वा रचना सारेर आफ्नै नाममा विद्यालय वा विश्वविद्यालयमा बुझाउनु",ग:"अनुपयुक्त तरिकाले उद्धरण चिन्ह राख्नु",घ:"आफ्नै पुराना लेखबाट नयाँ सन्दर्भ सामग्री बनाउनु"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:38,text:"बौद्धिक चोरीबाट बच्नका लागि अपनाउन सकिने मुख्य उपाय कुन हो?",options:{क:"इन्टरनेटबाट डाटाहरू पुरै कपी पेस्ट गर्ने",ख:"उपयुक्त तरिकाले लेखक र स्रोतको नाम उल्लेख (Citation) गर्ने",ग:"आफ्ना सबै प्रतिवेदन गोप्य राख्ने",घ:"पुस्तकको फोटो खिचेर मात्र प्रस्तुत गर्ने"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:39,text:"बौद्धिक चोरीबाट बच्नका लागि अरूको भनाइ वा विचारलाई तोडमरोड नगरी आफ्नै शब्दमा प्रस्तुत गर्ने शैलीलाई के भनिन्छ?",options:{क:"हुबहु नक्कल (Copy-paste)",ख:"पुनर्लेखन वा संक्षेपीकरण (Paraphrasing / Summarizing)",ग:"पादटिप्पणी संकलन",घ:"सन्दर्भ विलोपन"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:40,text:"नेपालको संविधानको कुन धारामा बौद्धिक सम्पत्तिलगायत अन्य सम्पत्ति आर्जन गर्ने, भोग गर्ने र व्यावसायिक लाभ प्राप्त गर्ने अधिकारको व्यवस्था गरिएको छ?",options:{क:"धारा १६ (सम्मानपूर्वक बाँच्न पाउने अधिकार)",ख:"धारा २५ (सम्पत्तिको अधिकार)",ग:"धारा ३० (स्वच्छ वातावरणको अधिकार)",घ:"धारा ३५ (स्वास्थ्यसम्बन्धी अधिकार)"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:41,text:"नेपालको प्रतिलिपि अधिकार ऐन, २०५९ को दफा २७ अनुसार पहिलो पटक अरूको प्रतिलिपि अधिकार उल्लङ्घन गर्ने (बौद्धिक चोरी गर्ने) व्यक्तिलाई कस्तो कानुनी कारबाहीको व्यवस्था छ?",options:{क:"केवल सामान्य चेतावनी मात्र दिइन्छ।",ख:"कसुरको मात्राअनुसार रु. १०,००० देखि रु. १,००,००० सम्म जरिवाना वा ६ महिनासम्म कैद वा दुवै सजाय",ग:"आजन्म कारावासको सजाय",घ:"केवल सरकारी नोकरीबाट बर्खास्त गरिने व्यवस्था"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:42,text:"प्रतिलिपि अधिकार ऐन, २०५९ अनुसार दोस्रो पटकदेखि पटकैपिच्छे प्रतिलिपि अधिकार उल्लङ्घन गर्ने व्यक्तिलाई कस्तो सजाय तोकिएको छ?",options:{क:"रु. १०,००० जरिवाना मात्र",ख:"प्रत्येक पटक रु. २०,००० देखि रु. २,००,००० सम्म जरिवाना वा १ वर्षसम्म कैद वा दुवै सजाय",ग:"नेपाल छाड्नुपर्ने देश निकालाको सजाय",घ:"कुनै पनि आर्थिक जरिवाना विनाको सामाजिक बहिष्कार"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:43,text:"उद्धरण ढाँचा (Citation Style) अन्तर्गत APA को पूर्ण रूप के हो र यो सामान्यतया कुन क्षेत्रमा बढी प्रयोग गरिन्छ?",options:{क:"American Poet Association - साहित्य क्षेत्र",ख:"American Psychological Association - शिक्षा, मनोविज्ञान र सामाजिक विज्ञान क्षेत्र",ग:"Asian Plagiarism Agency - कानुन क्षेत्र",घ:"Alliance of Public Academies - विज्ञान क्षेत्र"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:44,text:"भाषा र साहित्य (Language & Literature) का अनुसन्धान तथा प्रतिवेदनहरूमा सामान्यतया कुन उद्धरण ढाँचा (Citation Style) बढी प्रचलित छ?",options:{क:"APA (American Psychological Association)",ख:"MLA (Modern Language Association)",ग:"Harvard Style",घ:"IEEE Style"},correct:"ख",lesson:"लेखनकार्यमा अरूको लेखरचनाको प्रयोग गर्दा ध्यान दिनुपर्ने नैतिक पक्ष"},{id:45,text:"अनुसन्धान कार्यको पहिलो र मुख्य प्रस्थानविन्दु कुन हो?",options:{क:"सन्दर्भ सामग्रीको लेखन",ख:"तथ्याङ्क प्रशोधन र कोडीकरण",ग:"अनुसन्धानका लागि उपयुक्त समस्याको पहिचान र निर्माण (Problem Formulation)",घ:"कम्प्युटरमा एक्सेल सिट निर्माण"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:45,text:"अनुसन्धानका लागि समस्या छनोट गर्दा ध्यान दिनुपर्ने मुख्य दुईवटा प्राज्ञिक पक्षहरू कुन-कुन हुन्?",options:{क:"समस्या सस्तो हुनुपर्ने र कसैले पनि नबुझ्ने जटिल हुनुपर्ने",ख:"समस्या बिल्कुलै नयाँ (No duplication) हुनुपर्ने र समाजका लागि उपयोगी एवं नयाँ ज्ञान दिने खालको हुनुपर्ने",ग:"समस्या सधैँ केवल ऐतिहासिक विषयमा मात्र आधारित हुनुपर्ने",घ:"समस्या केवल एउटा पुस्तकबाट मात्र कपी गरिएको हुनुपर्ने"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:47,text:"अनुसन्धान पद्धति (Research Methodology) लाई मुख्य रूपमा कति भागमा वर्गीकरण गर्न सकिन्छ?",options:{क:"केवल एक (परम्परागत पद्धति)",ख:"दुई (प्राथमिक र द्वितीयक पद्धति)",ग:"तीन (परिमाणात्मक, गुणात्मक र मिश्रित पद्धति)",घ:"पाँच (डिजिटल, म्यानुअल, ऐतिहासिक, भौगोलिक र वैज्ञानिक)"},correct:"ग",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:48,text:"तथ्याङ्कलाई सङ्ख्यामा मापन गरिने, ठुलो नमुना (Sample) लिइने र साङ्ख्यिकीय विश्लेषण गरिने पद्धति कुन हो?",options:{क:"गुणात्मक पद्धति (Qualitative)",ख:"परिमाणात्मक पद्धति (Quantitative)",ग:"ऐतिहासिक पद्धति",घ:"वर्णनात्मक पद्धति"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:49,text:"मानिसका भावना, विचार, दृष्टिकोण, विश्वास, व्यवहार वा अनुभवको गहिरो विश्लेषण गरिने गैर-सङ्ख्यात्मक पद्धति कुन हो?",options:{क:"परिमाणात्मक पद्धति",ख:"गुणात्मक पद्धति (Qualitative)",ग:"प्रयोग विधि (Experimental Method)",घ:"सर्वेक्षण विधि (Survey)"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:50,text:"परिमाणात्मक पद्धतिका दुईवटा प्रमुख प्रयोगात्मक वा व्यावहारिक विधिहरू कुन-कुन हुन्?",options:{क:"कथा लेखन र कविता वाचन",ख:"सर्वेक्षण विधि (Survey) र प्रयोग विधि (Experimental Method)",ग:"केवल पुस्तकालय अध्ययन र इन्टरनेट सर्फिङ",घ:"कोडीकरण र गुणात्मक सञ्जाल"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:51,text:"अन्तर्वार्ता लिने क्रममा सोधिने सबै प्रश्नहरू पहिले नै निश्चित गरी तयार पारिएको र क्रम पनि तोकिएको अन्तर्वार्तालाई के भनिन्छ?",options:{क:"असंरचित अन्तर्वार्ता (Unstructured Interview)",ख:"अर्धसंरचित अन्तर्वार्ता (Semi-structured Interview)",ग:"संरचित अन्तर्वार्ता (Structured Interview)",घ:"खुला अन्तर्वार्ता"},correct:"ग",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:52,text:"अनुसन्धानकर्ताले मुख्य-मुख्य बुँदा वा विषयवस्तुको मार्गदर्शन (Interview Guide) मात्र तयार पारेर कुराकानीको क्रममा नयाँ प्रश्नहरू थप्न सक्ने अन्तर्वार्ता कुन हो?",options:{क:"संरचित अन्तर्वार्ता",ख:"अर्धसंरचित अन्तर्वार्ता (Semi-structured Interview)",ग:"औपचारिक अन्तर्वार्ता",घ:"कम्प्युटर सर्वेक्षण अन्तर्वार्ता"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:53,text:"अनुसन्धानकर्ताले कुनै निश्चित पूर्व-निर्धारित प्रश्न विना उत्तरदातासँग स्वतन्त्र रूपमा गहिरो छलफल गरी सूचना सङ्कलन गर्ने अन्तर्वार्ता कुन हो?",options:{क:"संरचित अन्तर्वार्ता",ख:"अर्धसंरचित अन्तर्वार्ता",ग:"असंरचित अन्तर्वार्ता (Unstructured Interview)",घ:"लिखित अन्तर्वार्ता"},correct:"ग",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:54,text:"कुनै व्यक्ति, संस्था वा सामाजिक प्रक्रियालाई लामो समयसम्म नजिकबाट हेरेर, सुनेर र व्यवहार महसुस गरेर तथ्याङ्क सङ्कलन गर्ने विधिलाई के भनिन्छ?",options:{क:"प्रश्नावली विधि",ख:"अवलोकन विधि (Observation Method)",ग:"दोस्रो स्रोत सङ्कलन",घ:"पादटिप्पणी सङ्ग्रह"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:55,text:"अवलोकन विधिलाई थप व्यवस्थित र विश्वासिलो बनाउन अनुसन्धानकर्ताले फिल्डमा के प्रयोग गर्दछ?",options:{क:"गुगल फर्म र सोसल नेटवर्क",ख:"रुजुसूची (Checklist) वा अवलोकन मार्गदर्शन (Observation Guide)",ग:"माइक्रोसफ्ट एक्सेलको सूत्र",घ:"सन्दर्भ सामग्रीको APA ढाँचा"},correct:"ख",lesson:"सामाजिक अध्ययनका लागि समस्या निर्माण र अध्ययन विधि चयन"},{id:56,text:"मानिसका विचार, धारणा, धर्म, सामाजिक परम्परा, चालचलन र सम्बन्ध कस्तो सामाजिक तथ्याङ्कका उदाहरण हुन्?",options:{क:"परिमाणात्मक सामाजिक तथ्याङ्क",ख:"गुणात्मक सामाजिक तथ्याङ्क (Qualitative Social Data)",ग:"सङ्ख्यात्मक सामाजिक तथ्याङ्क",घ:"वित्तीय सामाजिक तथ्याङ्क"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:57,text:"तथ्याङ्क सङ्कलन गर्ने साधनहरू छनोट गर्दा ध्यान दिनुपर्ने ५ वटा मुख्य कुराहरूमध्ये तलका मध्ये कुन पर्छ?",options:{क:"केवल कम्प्युटरको मूल्य र ब्रान्ड",ख:"अनुसन्धानको प्रकार, उद्देश्य, उत्तरदाताको प्रकृति, र उपलब्ध स्रोत-साधन",ग:"पुस्तकालयमा रहेका किताबको रङ",घ:"गुगलको स्थापना वर्ष"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:58,text:"उत्तरदाता आफैँले भरेर बुझाउने गरी तयार पारिएको प्रश्नहरूको व्यवस्थित सूची वा साधनलाई के भनिन्छ?",options:{क:"अन्तर्वार्ता मार्गदर्शन (Interview Guide)",ख:"प्रश्नावली (Questionnaire)",ग:"रुजुसूची (Checklist)",घ:"अवलोकन डायरी"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:59,text:"ठुलो भौगोलिक क्षेत्रमा रहेका धेरै उत्तरदाताहरूबाट कम समय र कम खर्चमा तथ्याङ्क सङ्कलन गर्न सबैभन्दा बढी प्रचलित साधन कुन हो?",options:{क:"असंरचित अन्तर्वार्ता",ख:"प्रत्यक्ष सहभागी अवलोकन",ग:"प्रश्नावली (Questionnaire)",घ:"फोकस ग्रुप डिस्कसन (FGD)"},correct:"ग",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:60,text:"प्रश्नावली निर्माण गर्दा ध्यान दिनुपर्ने प्रमुख नियम कुन हो?",options:{क:"प्रश्नहरू अत्यधिक लामा र धेरै अर्थ लाग्ने (Double-barreled) हुनुपर्छ।",ख:"उत्तरदाताको व्यक्तिगत भावना वा स्वाभिमानमा चोट पुर्‍याउने प्रश्न राख्नुपर्छ।",ग:"प्रश्नहरू सरल, स्पष्ट, छोटा र दोहोरो अर्थ नलाग्ने हुनुपर्छ।",घ:"प्रश्नहरू सधैँ केवल अङ्ग्रेजी भाषामा मात्र हुनुपर्छ।"},correct:"ग",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:61,text:"गुगल (Google) कम्पनीले विकास गरेको, प्रश्नावली निर्माण गरी अनलाइनमार्फत उत्तरदातामा पठाउन सकिने निःशुल्क डिजिटल साधन कुन हो?",options:{क:"Google Meet",ख:"Google Form (गुगल फर्म)",ग:"Google Drive",घ:"Gmail Messenger"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:62,text:"गुगल फर्म (Google Form) को प्रयोग गर्दा प्राप्त हुने सबैभन्दा ठुलो प्राविधिक फाइदा के हो?",options:{क:"यसमा उत्तरदाताले इन्टरनेट विना नै काम गर्न सक्छ।",ख:"उत्तरदाताले भरेका विवरणहरू स्वतः अनलाइन स्प्रेडसिट (Google Spreadsheet/Excel) मा प्रविष्टि र तालिकीकरण हुन्छन्।",ग:"यसले आफैँ अनुसन्धानको प्रतिवेदन र निष्कर्ष लेखिदिन्छ।",घ:"यसले सबै द्वितीयक स्रोतहरू स्वतः प्रतिबन्ध गर्छ।"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:63,text:"गुगल फर्मबाहेक इन्टरनेटमा अनलाइन सर्वेक्षणका लागि प्रयोग गरिने अन्य व्यावसायिक (Commercial) डिजिटल प्रोग्राम कुन हो?",options:{क:"IBM SPSS",ख:"SoGoSurvey, SurveyMonkey वा Zoho Survey",ग:"ATLAS.ti",घ:"OriginPro"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:64,text:"अनुसन्धानमा टाढा-टाढा रहेका उत्तरदाताहरूसँग भिडियो कल वा प्रत्यक्ष अनलाइन संवाद गरी अन्तर्वार्ता लिन उपयोगी एप्लिकेसन कुन हो?",options:{क:"NVivo",ख:"Zoom, Microsoft Teams वा Google Meet",ग:"MS Excel",घ:"STATA"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:65,text:"अनुसन्धानकर्ताहरूले फेसबुक वा एक्स (ट्विटर) जस्ता सामाजिक सञ्जाल (Social Networks) लाई कुन कार्यका लागि प्रयोग गर्न सक्छन्?",options:{क:"केवल व्यक्तिगत फोटोहरू सेयर गर्न",ख:"प्रश्नावलीको लिङ्क पठाउन, सरोकारवाला समूह (Focus Group) सँग छलफल गर्न र विचार सङ्कलन गर्न",ग:"एक्सेलको गणितीय सूत्र टाइप गर्न",घ:"बनेपा नगरको ऐतिहासिक शिलालेख भण्डारण गर्न"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:66,text:"सामाजिक तथ्याङ्क सङ्कलनका सन्दर्भमा 'कुन भनाइ गलत छ' (Which does not belong) पहिल्याउनुहोस्:",options:{क:"प्रश्नावली पठाउनुअघि साना समूहमा पूर्व-परीक्षण (Pre-testing) गर्नु राम्रो मानिन्छ।",ख:"अन्तर्वार्ता मार्गदर्शन (Interview Guide) केवल परिमाणात्मक सर्वेक्षणमा मात्र प्रयोग गरिन्छ।",ग:"रुजुसूची (Checklist) मा 'हो/होइन' वा 'छ/छैन' विकल्पहरू राखिन्छन्।",घ:"द्वितीयक तथ्याङ्क सङ्कलन गर्दा राष्ट्रिय वा अन्तर्राष्ट्रिय प्रतिवेदनको सहयोग लिन सकिन्छ।"},correct:"ख",lesson:"सामाजिक तथ्याङ्क र सूचना सङ्कलनका विधि र साधनहरू"},{id:67,text:"सङ्कलन गरी ल्याइएका कच्चा तथ्याङ्कहरूलाई त्रुटिरहित बनाउन, सफाइ गर्न र वर्गीकरण गर्ने प्रक्रियालाई के भनिन्छ?",options:{क:"तथ्याङ्क विश्लेषण",ख:"तथ्याङ्क तयारी र प्रशोधन (Data Preparation & Processing)",ग:"नतिजा प्रबोधिकरण",घ:"वर्णानुक्रम निर्माण"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:68,text:"परिमाणात्मक तथ्याङ्क (Quantitative Data) को साङ्ख्यिकीय विश्लेषण गर्न प्रयोग गरिने प्रख्यात कम्प्युटर सफ्टवेयर कुन हो?",options:{क:"NVivo",ख:"ATLAS.ti",ग:"IBM SPSS Statistics (वा RStudio, STATA)",घ:"Quirkos"},correct:"ग",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:69,text:"मानिसका अन्तर्वार्ताका रेकर्ड, भनाइ वा गुणात्मक विवरणहरूको कोडीकरण (Coding) र विश्लेषण गर्न प्रयोग गरिने सफ्टवेयर कुन हो?",options:{क:"IBM SPSS",ख:"NVivo, ATLAS.ti वा MAXQDA",ग:"OriginPro",घ:"TiMi Suite"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:70,text:"अनुसन्धानबाट प्राप्त निष्कर्ष वा नतिजाहरूलाई सम्बन्धित सरोकारवाला, नीति निर्माता वा सर्वसाधारणमाझ बाँड्ने वा प्रसारण गर्ने कार्यलाई के भनिन्छ?",options:{क:"तथ्याङ्क भण्डारण (Storage)",ख:"नतिजा प्रबोधिकरण (Result Dissemination)",ग:"तथ्याङ्क तयारी",घ:"कोडीकरण"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:71,text:"नतिजा प्रबोधिकरण गर्दा 'शाब्दिक प्रस्तुतीकरण' (Verbal Presentation) मा ध्यान दिनुपर्ने प्रमुख नियम कुन हो?",options:{क:"अत्यधिक आलङ्कारिक र साहित्यिक भाषा प्रयोग गर्नुपर्छ।",ख:"सधैँ लेखकको व्यक्तिगत भावना वा पक्षधरता स्पष्ट देखिनुपर्छ।",ग:"भाषा सरल, स्पष्ट, संक्षिप्त, दोहोरो अर्थ नलाग्ने र संवेगरहित (भावनाविहीन) हुनुपर्छ।",घ:"वाक्यहरू जतिसक्दो लामा र जटिल बनाउनुपर्छ।"},correct:"ग",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:72,text:"ठुला र जटिल परिमाणात्मक तथ्याङ्कलाई थोरै स्थानमा स्पष्ट रूपमा बुझाउन र कम समयमा प्रभावकारी रूपमा प्रस्तुत गर्न कुन प्रस्तुतीकरण उत्तम मानिन्छ?",options:{क:"लामो शाब्दिक वर्णनात्मक प्रस्तुतीकरण",ख:"चित्रात्मक प्रस्तुतीकरण (Visual/Graphical Presentation)",ग:"केवल पादटिप्पणीको सूची",घ:"प्रतिलिपि अधिकार ऐनको दफा कपी गर्ने"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:73,text:"कुनै पनि कार्य वा अनुसन्धानको क्रमिक प्रक्रिया बुझाउनका लागि प्रयोग गरिने चित्रात्मक साधन कुन हो?",options:{क:"वृत्तचित्र वा पाई चार्ट (Pie Chart)",ख:"फ्लोचार्ट (Flowchart)",ग:"स्तम्भचित्र (Bar Chart)",घ:"रेखाचित्र (Line Chart)"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:74,text:"कुनै कार्यालय, संघसंस्था वा विद्यालयको तहगत संरचना वा पदसोपान (Hierarchy) देखाउन कुन चित्र उपयुक्त हुन्छ?",options:{क:"रेखाचित्र",ख:"सङ्गठन चार्ट (Organization Chart)",ग:"वृत्तचित्र",घ:"स्तम्भचित्र"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:75,text:"तथ्याङ्कको कुल १०० प्रतिशत (100%) मानको वितरण वा हिस्सा फरक-फरक वर्गमा कसरी बाँडिएको छ भनी तुलना गर्न सबैभन्दा उपयोगी चित्र कुन हो?",options:{क:"फ्लोचार्ट",ख:"वृत्तचित्र वा पाई चार्ट (Pie Chart)",ग:"रेखाचित्र (Line Chart)",घ:"सङ्गठन चार्ट"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:76,text:"चित्रात्मक प्रस्तुतीकरण (चार्ट र ग्राफ) गर्दा ध्यान दिनुपर्ने अनिवार्य ५ कुराहरू कुन-कुन हुन्?",options:{क:"केवल महँगो कम्प्युटर, रङ्गीन प्रिन्टर, इन्टरनेट जडान, ब्याकअप र पासवर्ड",ख:"शीर्षक, सङ्केत (Legend), उपयुक्त आकार, स्पष्ट रङ र स्रोत उल्लेख",ग:"लेखकको नाम, विद्यालयको ठेगाना, प्रतिलिपि अधिकार, परीक्षा बोर्ड र मिति",घ:"माइक्रोसफ्ट एक्सेलको भर्सन र लाइसेन्स की"},correct:"ख",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:77,text:"तथ्याङ्क प्रस्तुतीकरणका सन्दर्भमा 'कुन भनाइ गलत छ' (Which does not belong) पहिचान गर्नुहोस्:",options:{क:"शाब्दिक प्रस्तुतीकरण गर्दा दोहोरो अर्थ नलाग्ने शब्दहरू मात्र छनोट गर्नुपर्छ।",ख:"माइक्रोसफ्ट वर्ड (MS Word) को 'Insert -> SmartArt' प्रयोग गरी फ्लोचार्ट बनाउन सकिन्छ।",ग:"परिमाणात्मक डाटाहरू विश्लेषण गर्न केवल NVivo सफ्टवेयर मात्र उपयुक्त हुन्छ।",घ:"चित्र वा चार्ट बनाउँदा सधैँ तथ्याङ्कको वास्तविक स्रोत खुलाउनुपर्छ।"},correct:"ग",lesson:"तथ्याङ्क तथा सूचनाको विश्लेषण र प्रस्तुतीकरण"},{id:78,text:"माइक्रोसफ्ट एक्सेल (MS Excel) कुन प्रकारको सफ्टवेयर प्रोग्राम हो?",options:{क:"वर्ड प्रोसेसिङ सफ्टवेयर",ख:"स्प्रेडसिट (Spreadsheet) सफ्टवेयर",ग:"फोटो एडिटिङ सफ्टवेयर",घ:"प्रिजेन्टेसन सफ्टवेयर"},correct:"ख",lesson:"तथ्याङ्क प्रशोधन र विश्लेषणमा माइक्रोसफ्ट एक्सेलको प्रयोग"},{id:79,text:"माइक्रोसफ्ट एक्सेलको सिटमा तेर्सो रूपमा रहने तेर्सा रेखाहरू (Rows) लाई के भनिन्छ र यिनीहरूलाई केले सङ्केत गरिन्छ?",options:{क:"Columns - अक्षरहरूले (A, B, C...)",ख:"Rows - सङ्ख्याहरूले (1, 2, 3...)",ग:"Cells - सङ्केतहरूले",घ:"Formulas - बराबर चिन्हले"},correct:"ख",lesson:"तथ्याङ्क प्रशोधन र विश्लेषणमा माइक्रोसफ्ट एक्सेलको प्रयोग"},{id:80,text:"माइक्रोसफ्ट एक्सेलको सिटमा ठाडो रूपमा रहने स्तम्भहरू (Columns) लाई केले सङ्केत गरिन्छ?",options:{क:"सङ्ख्याहरूले (1, 2, 3...)",ख:"अङ्ग्रेजी वर्णमालाका अक्षरहरूले (A, B, C...)",ग:"रोमन अङ्कहरूले (I, II, III...)",घ:"साङ्ख्यिकीय चिन्हहरूले"},correct:"ख",lesson:"तथ्याङ्क प्रशोधन र विश्लेषणमा माइक्रोसफ्ट एक्सेलको प्रयोग"},{id:81,text:"एक्सेल सिटमा एउटा कोलम र एउटा रो काटिएर बन्ने सानो वर्गाकार वा कोठालाई के भनिन्छ?",options:{क:"बक्स (Box)",ख:"सेल (Cell)",ग:"रेन्ज (Range)",घ:"सिट (Sheet)"},correct:"ख",lesson:"तथ्याङ्क प्रशोधन र विश्लेषणमा माइक्रोसफ्ट एक्सेलको प्रयोग"},{id:82,text:"माइक्रोसफ्ट एक्सेलमा कुनै पनि गणितीय वा साङ्ख्यिकीय सूत्र (Formula) सुरु गर्दा सबैभन्दा पहिले कुन चिन्ह अनिवार्य रूपमा राख्नुपर्छ?",options:{क:"जोड चिन्ह (+)",ख:"बराबर चिन्ह (=)",ग:"भाग चिन्ह (/)",घ:"डलर चिन्ह ($)"},correct:"ख",lesson:"तथ्याङ्क प्रशोधन र विश्लेषणमा माइक्रोसफ्ट एक्सेलको प्रयोग"},{id:83,text:"एक्सेलमा सेल B2 देखि सेल B11 सम्मका तथ्याङ्कहरूको 'मध्यक' (Mean / Average) गणना गर्न कुन सही सूत्र प्रयोग गरिन्छ?",options:{क:"`=MEAN(B2:B11
