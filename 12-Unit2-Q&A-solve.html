२. \uD83D\uDCDD रोजगारी र सिप विकास – अनलाइन सिकाइ, फ्रीलान्सिङ र डिजिटल मार्केटिङको अवसर बढ्छ।
३. \uD83D\uDCCA अनुसन्धानमा सहजता – तथ्याङ्क संकलन, विश्लेषण (Excel, SPSS, Google Form) र प्रस्तुतीकरण सजिलो हुन्छ।
४. \uD83C\uDF10 सञ्चार र सहकार्य – ईमेल, भिडियो कल, क्लाउडबाट समूह कार्य प्रभावकारी हुन्छ।
५. \uD83D\uDD12 सुरक्षित र जिम्मेवार प्रयोग – साइबर सुरक्षा, फेक न्यूज पहिचान र डिजिटल अधिकार बुझ्न सकिन्छ।`},{id:"2.4",marks:5,q:"गुणात्मक र परिमाणात्मक अनुसन्धान बीच भिन्नता लेख्नुहोस्।",a:"",table:{headers:["गुणात्मक","परिमाणात्मक"],rows:[["गुण, भावना, अर्थमा केन्द्रित","संख्या, नाप, प्रतिशतमा केन्द्रित"],["शब्द, चित्र, कथामा नतिजा","अंक, तालिका, ग्राफमा नतिजा"],["सानो नमुना, गहिरो अध्ययन","ठूलो नमुना, व्यापक अध्ययन"],["अन्तर्वार्ता, समूह छलफल","प्रश्नावली, सर्वेक्षण"],["व्याख्यात्मक हुन्छ","परीक्षणात्मक हुन्छ"]]}},{id:"2.5",marks:5,q:"तथ्याङ्क संकलनका प्रमुख विधिहरू के के हुन्? संक्षेपमा व्याख्या गर्नुहोस्।",a:`तथ्याङ्क संकलनका ५ प्रमुख विधिहरू:

१. अवलोकन (Observation) – घटनालाई प्रत्यक्ष हेरेर टिपोट गर्ने।
२. अन्तर्वार्ता (Interview) – आमनेसामने वा अनलाइन कुराकानीबाट जानकारी लिने।
३. प्रश्नावली (Questionnaire) – लिखित प्रश्नहरू उत्तरदातालाई दिएर उत्तर संकलन गर्ने, Google Form प्रयोग गरी डिजिटल संकलन गर्न सकिन्छ।
४. दस्तावेज अध्ययन – पुस्तक, प्रतिवेदन, रेकर्डबाट तथ्य लिने।
५. समूह छलफल (FGD) – ६-८ जनाको समूहमा छलफल गरी गुणात्मक सूचना लिने।`},{id:"2.6",marks:5,q:"अनुसन्धानमा नमुना छनोटको महत्त्व उल्लेख गर्नुहोस्।",a:`१. समय र लागत बचत – सबै जनसंख्याको अध्ययन गर्नुभन्दा सानो प्रतिनिधि समूह अध्ययन गर्न सजिलो।
२. शुद्धता र व्यवस्थापन – सानो समूहमा गहिरो र गुणस्तरीय अध्ययन सम्भव।
३. प्रतिनिधित्व – राम्रो नमुना छनोटले समग्र जनसंख्याको विशेषता झल्काउँछ।
४. सम्भाव्यता – ठूलो जनसंख्या भएको ठाउँमा सम्पूर्ण अध्ययन असम्भव भएकाले नमुना अनिवार्य हुन्छ।
५. डिजिटल उपकरणको प्रयोग – Random Number Generator, Excel =RAND() प्रयोग गरी निष्पक्ष नमुना छनोट गर्न सकिन्छ।`},{id:"2.7",marks:5,q:"साइबर सुरक्षा र डिजिटल नैतिकताका उपायहरू लेख्नुहोस्।",a:`१. बलियो पासवर्ड प्रयोग गर्ने र Two-Factor Authentication सक्रिय गर्ने।
२. अपरिचित लिंक र फिसिङ ईमेल नखोल्ने।
३. व्यक्तिगत তথ্য सामाजिक सञ्जालमा धेरै सार्वजनिक नगर्ने।
४. Plagiarism बाट बच्न स्रोत उल्लेख गर्ने र आफ्नै शब्दमा लेख्ने।
५. डिजिटल फुटप्रिन्टप्रति सचेत रहने – एक पटक इन्टरनेटमा राखेको कुरा मेटाउन गाह्रो हुन्छ।`},{id:"2.8",marks:5,q:"तथ्याङ्कका प्रकारहरू उदाहरण सहित लेख्नुहोस्।",a:"",table:{headers:["प्रकार","उप-प्रकार","उदाहरण"],rows:[["परिमाणात्मक","खण्डित (Discrete)","विद्यार्थी संख्या - ४५ जना"],["","निरन्तर (Continuous)","उचाइ - ५.५ फिट"],["गुणात्मक","नामात्मक (Nominal)","लिङ्ग - पुरुष/महिला"],["","क्रमात्मक (Ordinal)","सन्तुष्टि - उच्च/मध्यम/न्यून"]]}},{id:"2.9",marks:5,q:"अनुसन्धान प्रक्रियाका चरणहरू संक्षेपमा लेख्नुहोस्।",a:`१. समस्या पहिचान – के अनुसन्धान गर्ने? प्रश्न तय गर्ने।
२. साहित्य पुनरावलोकन – पहिलेका अनुसन्धान अध्ययन गर्ने।
३. परिकल्पना निर्माण – अनुमानित उत्तर वा सम्बन्ध तय गर्ने।
४. अनुसन्धान डिजाइन – विधि, नमुना, उपकरण तय गर्ने।
५. तथ्याङ्क संकलन र विश्लेषण – तथ्य जम्मा गरी Excel/SPSS मा विश्लेषण र निष्कर्ष निकाल्ने।`},{id:"2.10",marks:5,q:"डिजिटल उपकरणहरूले सामाजिक अध्ययनमा कसरी सहयोग गर्छन्?",a:`१. GIS र Google Earth ले स्थानिय विश्लेषणमा सहयोग।
२. Kobo Toolbox, ODK ले फिल्डमा तथ्याङ्क संकलन।
३. Excel, Google Sheets ले तथ्याङ्क व्यवस्थापन र ग्राफ निर्माण।
४. Zotero, Mendeley ले सन्दर्भ व्यवस्थापन।
५. Canva, Infogram ले नतिजा आकर्षक रूपमा प्रस्तुत गर्न सहयोग।`},{id:"2.11",marks:5,q:"विश्वसनीय स्रोत कसरी पहिचान गर्ने?",a:`१. लेखकको योग्यता र संस्था हेर्ने – .edu, .gov डोमेन बढी विश्वसनीय।
२. प्रकाशन मिति नयाँ छ कि छैन हेर्ने।
३. तथ्याङ्कमा सन्दर्भ र प्रमाण छ कि छैन हेर्ने।
४. पक्षपातरहित भाषा र सन्तुलित दृष्टिकोण छ कि छैन जाँच्ने।
५. Cross-check गर्ने – एउटै सूचना २-३ विश्वसनीय स्रोतमा तुलना गर्ने।`}],Sm=[{id:"3.1",marks:8,q:"डिजिटल तथा अनुसन्धान सिपको अवधारणा, महत्त्व र वर्तमान सन्दर्भमा यसको आवश्यकता बारे विस्तृत व्याख्या गर्नुहोस्।",a:`\uD83D\uDCDA परिचय:
डिजिटल तथा अनुसन्धान सिप भनेको आधुनिक प्रविधिको प्रयोग गरी सूचना खोज्ने, जाँच्ने, विश्लेषण गर्ने र नयाँ ज्ञान सिर्जना गर्ने क्षमता हो। कक्षा १२ को सामाजिक अध्ययनमा यो सिपले विद्यार्थीलाई सूचना युगमा सक्षम नागरिक बनाउँछ।

\uD83D\uDCDD महत्त्व:
१. सूचना साक्षरता – सही र गलत सूचना छुट्याउन सक्ने क्षमता। डिजिटल स्रोतबाट प्राथमिक स्रोत र द्वितीयक स्रोत छुट्याउने सिप।
२. आलोचनात्मक सोच – तथ्याङ्कलाई आँखा चिम्लेर नपत्याउने, प्रमाण खोज्ने बानी।
३. समस्या समाधान – समुदायका समस्या जस्तै: डिजिटल डिभाइड, बेरोजगारी, बसाइँसराइमा तथ्याङ्कीय अनुसन्धान गरी समाधान खोज्न सकिन्छ।
४. करियर विकास – Data Analyst, Researcher, GIS Expert जस्ता भविष्यका रोजगारीका लागि आधार।
५. लोकतन्त्र र सुशासन – Open Data प्रयोग गरी सरकारको बजेट, सेवा प्रवाह निगरानी गर्न सकिन्छ।

\uD83D\uDCCA वर्तमान आवश्यकता:
नेपालमा डिजिटल नेपाल फ्रेमवर्क २०७६ अनुसार सबै क्षेत्रमा डिजिटलाइजेसन भइरहेको छ। कोभिड-१९ पछि अनलाइन शिक्षाको विस्तारले डिजिटल सिप अनिवार्य भएको छ। तथापि ग्रामीण क्षेत्रमा अझै डिजिटल डिभाइड छ, जसलाई अनुसन्धान सिपले उजागर गर्न सक्छ।

निष्कर्ष: डिजिटल र अनुसन्धान सिप २१ औं शताब्दीको मूलभूत साक्षरता हो।`},{id:"3.2",marks:8,q:"अनुसन्धान भनेको के हो? अनुसन्धानका प्रकारहरू र गुणात्मक तथा परिमाणात्मक अनुसन्धानको तुलनात्मक विश्लेषण गर्नुहोस्।",a:`अनुसन्धान नयाँ ज्ञान खोज्ने व्यवस्थित प्रक्रिया हो।

\uD83D\uDCCA अनुसन्धानका प्रकारहरू:
१. उद्देश्यका आधारमा – अन्वेषणात्मक, वर्णनात्मक, व्याख्यात्मक
२. विधिका आधारमा – गुणात्मक र परिमाणात्मक
३. समयका आधारमा – Cross-sectional र Longitudinal
४. स्थानका आधारमा – पुस्तकालय, प्रयोगशाला, क्षेत्रगत (Field)

\uD83D\uDCDD गुणात्मक vs परिमाणात्मक – विस्तृत तुलना:
गुणात्मक अनुसन्धानमा ‘किन र कसरी’ भन्ने प्रश्नको उत्तर खोजिन्छ। सानो नमूनामा गहिरो अन्तर्वार्ता र अवलोकन गरिन्छ। नतिजा कथात्मक हुन्छ। जस्तै: युवाहरू किन विदेश जान्छन्? भन्ने कारण बुझ्न।

परिमाणात्मक अनुसन्धानमा ‘कति र कुन अनुपातमा’ भन्ने प्रश्न हुन्छ। ठूलो नमूनामा प्रश्नावली प्रयोग गरी संख्या निकालिन्छ। नतिजा तालिका, प्रतिशत, औसत, ग्राफमा प्रस्तुत हुन्छ। जस्तै: कति प्रतिशत युवा वैदेशिक रोजगारीमा जान चाहन्छन्?

\uD83D\uDD12 उत्तम अभ्यास: आजकल Mixed Method प्रयोग हुन्छ – पहिले परिमाणात्मक सर्वेक्षण गरी प्रतिशत निकाल्ने, त्यसपछि गुणात्मक अन्तर्वार्ताबाट कारण बुझ्ने। यसले अनुसन्धान बढी विश्वसनीय हुन्छ।`},{id:"3.3",marks:8,q:"चर (Variable) भनेको के हो? चरका प्रकारहरू उदाहरण सहित व्याख्या गर्नुहोस्।",a:`चर अनुसन्धानको मुटु हो। चर नभइ अनुसन्धान सम्भव छैन।

\uD83D\uDCDA चरका मुख्य प्रकारहरू:

१. स्वतन्त्र चर (Independent Variable) – कारण। जस्तै: सामाजिक सञ्जाल चलाउने समय।
२. परतन्त्र चर (Dependent Variable) – प्रभाव। जस्तै: शैक्षिक उपलब्धि।
अनुसन्धान प्रश्न: ‘के सामाजिक सञ्जालले पढाइमा असर गर्छ?’ यहाँ चलाउने समय स्वतन्त्र चर, अंक परतन्त्र चर।

३. नियन्त्रित चर (Control Variable) – स्थिर राखिने। जस्तै: सबै विद्यार्थी कक्षा १२ कै।
४. मध्यस्थ चर (Mediating) – बीचमा आउने। जस्तै: निद्राको कमी।
५. बाह्य चर (Extraneous) – अनपेक्षित प्रभाव। जस्तै: पारिवारिक समस्या।

\uD83D\uDCCA चरलाई कसरी नाप्ने? – Operationalization
उमेर = वर्षमा, आय = रुपैयाँमा, डिजिटल साक्षरता = १० प्रश्नको स्केलमा अंक।

उदाहरण तालिका:`,table:{headers:["चरको नाम","प्रकार","मापन विधि"],rows:[["सामाजिक सञ्जाल प्रयोग","स्वतन्त्र","घण्टा/दिन"],["SEE GPA","परतन्त्र","४.० स्केल"],["लिङ्ग","नियन्त्रित","पुरुष/महिला"],["निद्रा अवधि","मध्यस्थ","घण्टा"]]}},{id:"3.4",marks:8,q:"तथ्याङ्क (Data) र तथ्याङ्कका प्रकारहरू, प्राथमिक र द्वितीयक स्रोतको महत्त्व बारे लेख्नुहोस्।",a:`तथ्याङ्क अनुसन्धानको कच्चा पदार्थ हो।

\uD83D\uDCCA तथ्याङ्कका प्रकारहरू:
१. गुणात्मक – वर्णनात्मक (विचार, अनुभव)
२. परिमाणात्मक – संख्यात्मक (जनसंख्या, आय)
३. प्राथमिक – प्रत्यक्ष संकलन (तपाईंले आफैं लिने)
४. द्वितीयक – अप्रत्यक्ष (अरूले लिएको प्रयोग गर्ने)

\uD83D\uDCDD प्राथमिक स्रोतको महत्त्व:
- मौलिक र तपाईंको अनुसन्धान प्रश्न अनुसारको हुन्छ।
- नवीनतम हुन्छ।
- तर समय, लागत बढी लाग्छ।
उदाहरण: तपाईंको विद्यालयका १०० विद्यार्थीमा Google Form बाट ‘डिजिटल सिप’ बारे सर्वेक्षण।

\uD83D\uDCDA द्वितीयक स्रोतको महत्त्व:
- साहित्य पुनरावलोकनका लागि अनिवार्य।
- ठूला राष्ट्रिय तथ्याङ्क जस्तै: जनगणना २०७८, NLFS, NDHS प्रयोग गर्न सकिन्छ।
- तर पुरानो वा तपाईंको प्रश्नसँग नमिल्ने हुन सक्छ।

\uD83D\uDD12 सुझाव: राम्रो अनुसन्धानमा दुवै प्रयोग हुन्छ। पहिले द्वितीयक स्रोतबाट पृष्ठभूमि बुझ्ने, अनि प्राथमिक तथ्याङ्कले नयाँ कुरा थप्ने।`},{id:"3.5",marks:8,q:"तथ्याङ्क संकलनका विधि र उपकरणहरूको विस्तृत वर्णन गर्नुहोस्।",a:`तथ्याङ्क संकलन अनुसन्धानको सबैभन्दा महत्त्वपूर्ण चरण हो। विधि सही भएन भने निष्कर्ष गलत हुन्छ।

१. \uD83D\uDCDD प्रश्नावली (Questionnaire):
   - संरचित (बन्द प्रश्न) – जस्तै: तपाईं दिनमा कति घण्टा इन्टरनेट चलाउनुहुन्छ? a) <1 b) 1-3 c) >3
   - अर्ध-संरचित – बन्द र खुला मिश्रित
   - फाइदा: धेरै मानिसमा छिटो, लागत कम, Google Form, Kobo Toolbox बाट डिजिटल संकलन।
   - सावधानी: प्रश्न स्पष्ट, दोहोरो अर्थ नहुने, संवेदनशील प्रश्न अन्त्यमा राख्ने।

२. \uD83D\uDCDA अन्तर्वार्ता (Interview):
   - संरचित, अर्ध-संरचित, असंरचित
   - गुणात्मक तथ्याङ्कका लागि उत्तम
   - सावधानी: सहमति लिने, गोपनीयता राख्ने, रेकर्ड गर्न अनुमति लिने।

३. \uD83D\uDC41️ अवलोकन (Observation):
   - सहभागी र असहभागी
   - जस्तै: सार्वजनिक पुस्तकालयमा युवाहरूले इन्टरनेट कसरी प्रयोग गर्छन् हेर्ने।

४. \uD83D\uDCAC समूह केन्द्रित छलफल (FGD):
   - ६-१० जनाको समूह, एक मोडरेटर
   - गहिरो धारणा बुझ्न उपयोगी

५. \uD83D\uDCCA दस्तावेज अध्ययन:
   - सरकारी प्रतिवेदन, समाचार, सामाजिक सञ्जाल पोस्ट विश्लेषण
   - Content Analysis विधि प्रयोग

डिजिटल उपकरणहरू: Kobo, ODK, Google Form, Excel – यी उपकरणले तथ्याङ्कलाई व्यवस्थित, सुरक्षित र विश्लेषण योग्य बनाउँछन्।`},{id:"3.6",marks:8,q:"नमुना छनोट (Sampling) के हो? नमुना छनोटका प्रकार र विधिहरू व्याख्या गर्नुहोस्।",a:`समग्र जनसंख्या (Population) बाट प्रतिनिधि समूह छान्नु नै नमुना छनोट हो। जनगणना बाहेक सबै अनुसन्धानमा नमुना चाहिन्छ।

\uD83D\uDCCA नमुना छनोटका प्रकारहरू:

A. सम्भाव्यता नमुना (Probability) – सबैले छानिने समान मौका पाउने, बढी वैज्ञानिक।
१. साधारण अनियमित (Simple Random) – चिट्ठा, Random Number Generator। जस्तै: ५०० विद्यार्थीबाट १०० जना चिट्ठाले।
२. स्तरीकृत (Stratified) – समूह बनाएर प्रत्येक समूहबाट नमुना। जस्तै: कक्षा १२ मा विज्ञान, व्यवस्थापन, मानविकीबाट ३३/३३/३४ जना।
३. गुच्छा (Cluster) – भूगोल अनुसार। जस्तै: काठमाडौंका ५ विद्यालय छानेर ती विद्यालयका सबै कक्षा १२।
४. व्यवस्थित (Systematic) – हरेक k औं व्यक्ति। जस्तै: हाजिरी क्रममा हरेक ५ औं विद्यार्थी।

B. असम्भाव्यता (Non-Probability) – सजिलो तर पक्षपात हुन सक्छ।
१. सुविधाजनक (Convenience) – सजिलै भेटिएका।
२. उद्देश्यमूलक (Purposive) – जानकार व्यक्ति। जस्तै: IT शिक्षकलाई मात्र अन्तर्वार्ता।
३. स्नोबल (Snowball) – एकले अर्कोलाई चिनाउने। लुकेका समूहका लागि उपयोगी।

\uD83D\uDCDD नमुना आकार कसरी तय गर्ने? – सानो जनसंख्यामा १०%, ठूलोमा ५% वा Slovin’s Formula: n = N/(1+Ne²) प्रयोग गरिन्छ। e = त्रुटि मार्जिन (0.05)।`},{id:"3.7",marks:8,q:"तथ्याङ्क विश्लेषण र प्रस्तुतीकरणका तरिकाहरू बारे वर्णन गर्नुहोस्।",a:`तथ्याङ्क संकलन गरेर मात्र पुग्दैन, त्यसलाई अर्थपूर्ण बनाउन विश्लेषण र प्रस्तुतीकरण चाहिन्छ।

\uD83D\uDCCA विश्लेषणका चरणहरू:
१. तथ्याङ्क सफा गर्ने (Cleaning) – खाली उत्तर, दोहोरिएको उत्तर हटाउने। Excel मा Filter प्रयोग।
२. कोडिङ – ‘पुरुष=१, महिला=२’ जस्तै संख्यामा बदल्ने।
३. वर्णनात्मक विश्लेषण – औसत (Mean), मध्यिका (Median), बहुलक (Mode), प्रतिशत निकाल्ने।
४. अनुमानात्मक विश्लेषण – दुई चर बीच सम्बन्ध छ कि छैन हेर्न Chi-square, Correlation प्रयोग (कक्षा १२ मा सामान्य परिचय)।

\uD83D\uDCDD प्रस्तुतीकरणका तरिकाहरू:
- तालिका (Table) – तुलनाका लागि उत्तम। शीर्षक, स्रोत खुलाउने।
- दण्ड चित्र (Bar Chart) – श्रेणी तुलना।
- वृत्त चित्र (Pie Chart) – भाग र समग्र सम्बन्ध।
- रेखा चित्र (Line Graph) – समयसँग परिवर्तन।
- Infographic – Canva, Infogram मा आकर्षक प्रस्तुति।

\uD83D\uDD12 डिजिटल उपकरण:
Excel =AVERAGE(), =COUNTIF(), PivotTable
Google Sheets – सहकार्यमा विश्लेषण
SPSS / Jamovi – उच्च तहको विश्लेषण

उदाहरण: ‘८०% विद्यार्थीले दैनिक ३ घण्टाभन्दा बढी सामाजिक सञ्जाल प्रयोग गर्छन् र तिनको औसत GPA २.८ छ भने कम प्रयोग गर्नेको ३.२ छ’ – यसरी तथ्याङ्कलाई कथामा बदल्ने।`},{id:"3.8",marks:8,q:"डिजिटल नागरिकता, साइबर सुरक्षा र अनुसन्धान नैतिकताको महत्त्व व्याख्या गर्नुहोस्।",a:`\uD83D\uDCDA डिजिटल नागरिकता – ९ तत्वहरू (Ribble):
१. पहुँच, २. वाणिज्य, ३. सञ्चार, ४. साक्षरता, ५. शिष्टाचार, ६. कानुन, ७. अधिकार र जिम्मेवारी, ८. स्वास्थ्य, ९. सुरक्षा।

\uD83D\uDD12 साइबर सुरक्षा:
नेपालमा साइबर अपराध बढ्दो छ – फेसबुक ह्याक, अनलाइन ठगी। त्यसैले:
- बलियो पासवर्ड: कम्तीमा १२ अक्षर, अक्षर+अंक+चिन्ह
- फिसिङबाट बच्ने: बैंकले कहिल्यै OTP माग्दैन भन्ने बुझ्ने
- Privacy Setting: फेसबुकमा ‘Only Me’ र ‘Friends’ मिलाउने
- Digital Wellbeing: Screen Time नियन्त्रण

\uD83D\uDCDD अनुसन्धान नैतिकता:
१. सूचित सहमति (Informed Consent) – ‘तपाईंको उत्तर गोप्य राखिन्छ, तपाईंले जुनसुकै बेला छोड्न सक्नुहुन्छ’ भनी फारममा लेख्ने।
२. गोपनीयता र गुमनामता – नाम नलेख्ने, कोड प्रयोग गर्ने।
३. इमानदारी – तथ्याङ्क नबंग्याउने, Plagiarism नगर्ने, APA 7th अनुसार सन्दर्भ लेख्ने।
४. हानि नपुर्याउने – बालबालिका, सीमान्तकृत समूहमा विशेष सावधानी।

उदाहरण: यदि तपाईं किशोरकिशोरीको सामाजिक सञ्जाल प्रयोगबारे अनुसन्धान गर्दै हुनुहुन्छ भने अभिभावकको सहमति, उत्तर गोप्य राख्ने प्रतिबद्धता र तथ्याङ्क केवल शैक्षिक प्रयोजनका लागि प्रयोग गर्ने नैतिकता अनिवार्य छ।`},{id:"3.9",marks:8,q:"GIS, Big Data, Open Data र Metadata को अवधारणा र सामाजिक अध्ययनमा प्रयोग बारे लेख्नुहोस्।",a:`\uD83D\uDCCA १. GIS (Geographic Information System):
- परिभाषा: स्थानिय तथ्याङ्कलाई नक्सामा देखाउने प्रणाली।
- प्रयोग: बाढी जोखिम नक्सा, विद्यालयको पहुँच नक्सा, बसाइँसराइ मार्ग नक्सा बनाउन।
- उपकरण: QGIS (निःशुल्क), Google Earth, ArcGIS
- उदाहरण: तपाईंको पालिकामा इन्टरनेट पहुँच नभएका वडा GIS मा रातो रंगले देखाउन सकिन्छ।

\uD83D\uDCDA २. Big Data:
- 5V: Volume, Velocity, Variety, Veracity, Value
- सामाजिक अध्ययनमा: फेसबुक, ट्वीटरका लाखौं पोस्ट विश्लेषण गरी जनमत बुझ्ने, मोबाइल डाटाबाट बसाइँसराइ ट्रयाक गर्ने।

\uD83D\uDCDD ३. Open Data:
- data.gov.np, Nepal in Data, World Bank Open Data जस्ता पोर्टलबाट निःशुल्क तथ्याङ्क लिन सकिन्छ।
- फाइदा: पारदर्शिता, अनुसन्धान लागत कम, नागरिकले सरकारलाई प्रश्न गर्न सक्छ।
- उदाहरण: बजेटको Open Data हेरेर तपाईंको पालिकाले शिक्षामा कति खर्च गर्यो विश्लेषण।

\uD83D\uDD12 ४. Metadata:
- ‘Data about Data’ – तथ्याङ्क कसले, कहिले, कसरी, कुन विधिबाट लियो भन्ने विवरण।
- महत्त्व: तथ्याङ्कको विश्वसनीयता जाँच्न, पुनः प्रयोग गर्न।
- उदाहरण: जनगणना २०७८ को Metadata मा ‘घरधुरी सर्वेक्षण, २०७८ मंसिर, १०% नमुना’ लेखिएको हुन्छ।`},{id:"3.10",marks:8,q:"एक अनुसन्धान प्रस्ताव (Research Proposal) को नमुना तयार गर्नुहोस्। विषय: ‘कक्षा १२ का विद्यार्थीमा डिजिटल लत र शैक्षिक उपलब्धि बीच सम्बन्ध’",a:`\uD83D\uDCDA अनुसन्धान प्रस्तावको ढाँचा:

१. शीर्षक: कक्षा १२ का विद्यार्थीमा डिजिटल लत (सामाजिक सञ्जाल प्रयोग) र शैक्षिक उपलब्धि बीचको सम्बन्ध – काठमाडौंका सामुदायिक विद्यालयको अध्ययन

२. पृष्ठभूमि: नेपालमा १५-२४ वर्ष उमेर समूहमा ८९% इन्टरनेट प्रयोगकर्ता छन् (NTA २०८०)। तर यसले पढाइमा पार्ने असरबारे स्थानीय तथ्याङ्क कम छ।

३. समस्या कथन: के धेरै सामाजिक सञ्जाल प्रयोगले GPA घटाउँछ?

४. उद्देश्य:
- प्रयोग समय मापन गर्ने
- GPA सँग सम्बन्ध परीक्षण गर्ने
- लतका कारण पत्ता लगाउने

५. परिकल्पना:
H1: सामाजिक सञ्जाल प्रयोग समय र GPA बीच नकारात्मक सम्बन्ध छ।

६. विधि:
- डिजाइन: मिश्रित (Mixed)
- जनसंख्या: काठमाडौंका १० सामुदायिक विद्यालयका कक्षा १२ का २००० विद्यार्थी
- नमुना: स्तरीकृत अनियमित – २०० जना (१०%)
- उपकरण: प्रश्नावली (Google Form) + १० जनासँग गहिरो अन्तर्वार्ता
- चर: स्वतन्त्र= प्रयोग घण्टा, परतन्त्र= GPA, नियन्त्रित= लिङ्ग, संकाय
- विश्लेषण: Excel मा औसत, Correlation, Bar Chart
- नैतिकता: गुमनामता, सहमति फारम, विद्यालय अनुमति

७. अपेक्षित नतिजा: डिजिटल लत नियन्त्रणका लागि विद्यालयमा सचेतना कार्यक्रम आवश्यक।

८. सन्दर्भ: APA शैलीमा।`},{id:"3.11",marks:8,q:"डिजिटल डिभाइड के हो? नेपालमा डिजिटल डिभाइडका कारण, असर र न्यूनीकरणका उपायहरू लेख्नुहोस्।",a:`\uD83D\uDCDA डिजिटल डिभाइड भनेको प्रविधि, इन्टरनेट र डिजिटल सिपमा पहुँच भएका र नभएका बीचको असमानता हो।

\uD83D\uDCCA नेपालमा अवस्था:
- सहरमा ७८% इन्टरनेट पहुँच, कर्णालीका दुर्गम गाउँमा २३% मात्र (NTA २०८१)।
- पुरुषको तुलनामा महिलाको डिजिटल साक्षरता १५% कम।

\uD83D\uDCDD कारणहरू:
१. भौगोलिक – हिमाल, पहाडमा टावर र बिजुली अभाव।
२. आर्थिक – स्मार्टफोन र डाटा महँगो।
३. शैक्षिक – डिजिटल साक्षरता कम, अंग्रेजी भाषाको बाधा।
४. लैंगिक र सामाजिक – छोरीलाई मोबाइल नदिने सोच।
५. नीतिगत – ग्रामीण क्षेत्रमा लगानी कम।

\uD83D\uDD12 असरहरू:
- शैक्षिक असमानता – अनलाइन कक्षा पहुँच नहुने।
- रोजगारीबाट बञ्चित – अनलाइन फारम भर्न नसक्ने।
- सूचना र सेवाबाट बञ्चित – कृषि सूचना, स्वास्थ्य सेवा।
- लोकतन्त्र कमजोर – Open Data प्रयोग गर्न नसक्ने।

\uD83D\uDCDD न्यूनीकरणका उपायहरू:
१. पूर्वाधार विस्तार – सबै पालिकामा फाइबर इन्टरनेट, सामुदायिक WiFi।
२. सस्तो उपकरण – विद्यार्थीलाई सहुलियतमा ट्याब।
३. डिजिटल साक्षरता कार्यक्रम – वडा-वडामा तालिम, स्थानीय भाषामा सामग्री।
४. नीति – डिजिटल नेपाल फ्रेमवर्क कार्यान्वयन, USF कोष परिचालन।
५. लैंगिक समानता – छात्रालाई विशेष डिजिटल छात्रवृत्ति।
