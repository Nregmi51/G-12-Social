"नवप्रवर्तन (Innovation)","मस्तिष्क मन्थन","मानसिक लचकता"],correct:1,expl:"नवप्रवर्तन भनेको पुरानै कुरालाई नयाँ तरिकाले उपयोगी र मूल्यवान बनाउनु हो, जस्तै टिनको बट्टालाई कलमदानी बनाउनु।"},{id:4,q:"कुनै जटिल समस्याको समाधानका लागि धेरैभन्दा धेरै विचारहरू कुनै आलोचना बिना निकाल्ने विधिलाई के भनिन्छ?",options:["समालोचना","मस्तिष्क मन्थन (Brainstorming)","आत्ममूल्याङ्कन","समानुभूति संवाद"],correct:1,expl:"Brainstorming मा जति धेरै विचार आउँछन्, त्यति नै मौलिक समाधान निस्कने सम्भावना बढ्छ। यहाँ पहिला मात्रामा जोड दिइन्छ, गुणस्तरमा पछि।"},{id:5,q:"परिस्थिति अनुसार आफ्नो सोचाइलाई परिवर्तन गर्न सक्ने क्षमतालाई के भनिन्छ?",options:["मानसिक दृढता","मानसिक लचकता (Mental Flexibility)","संज्ञानात्मक समानुभूति","आत्मनियमन"],correct:1,expl:"मानसिक लचकता भनेको एउटै कोणबाट मात्र होइन, बहुआयामिक कोणबाट समस्या हेर्न सक्ने क्षमता हो।"},{id:6,q:"वास्तविक संसारमा नभएको कुरालाई मनमा चित्रण गर्ने क्षमतालाई के भनिन्छ?",options:["प्रदीप्ति","नवप्रवर्तन","कल्पनाशीलता (Imagination)","प्रमाणिकता"],correct:2,expl:"कल्पनाशीलता नै सिर्जनात्मकताको इन्धन हो। हवाईजहाज बन्नुअघि पहिले कसैले उड्ने कल्पना नै गरेको थियो।"},{id:7,q:"ग्राहम वालास (Graham Wallas) ले सिर्जनात्मक चिन्तनका कतिवटा चरणहरू बताएका छन्?",options:["३ वटा","४ वटा","५ वटा","७ वटा"],correct:2,expl:"Graham Wallas ले 1926 मा 5 चरण बताए: तयारी, विकास (Incubation), प्रदीप्ति (Illumination), मूल्याङ्कन र प्रमाणीकरण।"},{id:8,q:"ग्राहम वालासको पहिलो चरण कुन हो?",options:["तयारी चरण (Preparation)","विकास चरण","प्रदीप्ति चरण","मूल्याङ्कन चरण"],correct:0,expl:"पहिलो चरण तयारी हो - जहाँ समस्या के हो भनेर बुझ्ने, तथ्य सङ्कलन गर्ने र गहिरो अध्ययन गरिन्छ।"},{id:9,q:"दोस्रो चरण 'विकास (Incubation)' चरणमा के हुन्छ?",options:["प्रयोगशालामा परीक्षण गरिन्छ","समस्यालाई सचेत मनबाट विश्राम दिएर अचेतन मनमा प्रशोधन हुन दिन्छ","तुरुन्तै निर्णय गरिन्छ","विवाद गरिन्छ"],correct:1,expl:"Incubation मा दिमागलाई आराम दिइन्छ। सचेत मनले छोड्दा अचेतन मनले भित्रभित्रै समाधान खोजिरहेको हुन्छ।"},{id:10,q:"विकास चरणमा कस्तो व्यवहार गर्नु उपयुक्त हुन्छ?",options:["कडा कसरत मात्र गर्ने","घुम्ने, सङ्गीत सुन्ने, सुत्ने वा दिमागलाई आराम दिने","गल्तीको सूची बनाउने","गृहकार्य दोहोर्याउने"],correct:1,expl:"घुमफिर, सङ्गीत, ध्यान, निद्रा - यी सबैले अचेतन मनलाई काम गर्ने ठाउँ दिन्छन्, त्यसैले नयाँ आइडिया फुर्छ।"},{id:11,q:"अचानक विचार झुल्किने, 'आहा!' भन्ने क्षणलाई कुन चरण भनिन्छ?",options:["तयारी","विकास","प्रदीप्ति चरण (Illumination)","प्रमाणीकरण"],correct:2,expl:"Illumination त्यो क्षण हो जब अचानक बिजुली झैँ समाधान दिमागमा चम्किन्छ। आर्किमिडिजको 'युरेका!' यही चरण हो।"},{id:12,q:"निस्केको विचार व्यावहारिक छ कि छैन भनेर जाँच गर्ने चरण कुन हो?",options:["तयारी","विकास","मूल्याङ्कन चरण (Evaluation)","प्रमाणीकरण"],correct:2,expl:"मूल्याङ्कनमा हामी समालोचनात्मक बन्छौं - यो आइडिया साँच्चै काम गर्छ? खर्च, फाइदा, बेफाइदा केलाउँछौं।"},{id:13,q:"सिर्जनात्मक प्रक्रियाको अन्तिम चरण कुन हो?",options:["मूल्याङ्कन","प्रमाणीकरण चरण (Verification)","प्रदीप्ति","विकास"],correct:1,expl:"प्रमाणीकरणमा विचारलाई वास्तविक रूपमा प्रयोग गरेर हेर्ने, प्रोटोटाइप बनाउने र सफल प्रमाणित गर्ने काम हुन्छ।"},{id:14,q:"ग्राहम वालासका 5 चरणको सही क्रम कुन हो?",options:["तयारी → प्रदीप्ति → विकास → मूल्याङ्कन → प्रमाणीकरण","तयारी → विकास → प्रदीप्ति → मूल्याङ्कन → प्रमाणीकरण","विकास → तयारी → प्रदीप्ति → मूल्याङ्कन → प्रमाणीकरण","तयारी → मूल्याङ्कन → विकास → प्रदीप्ति → प्रमाणीकरण"],correct:1,expl:"सही क्रम: तयारी (Preparation) → विकास (Incubation) → प्रदीप्ति (Illumination) → मूल्याङ्कन (Evaluation) → प्रमाणीकरण (Verification)।"},{id:15,q:"सिर्जनात्मक व्यक्तिको विशेषता कुन हो?",options:["संकुचित सोच र पुरानै नियममा अडिग रहने","असफलताको डरले केही नगर्ने","जिज्ञासु स्वभाव, खुलापन र असफलताबाट सिक्ने साहस","आलोचना मात्र गर्ने बानी"],correct:2,expl:"सिर्जनात्मक व्यक्ति जिज्ञासु हुन्छ, नयाँ अनुभवका लागि खुला हुन्छ र असफलतालाई सिक्ने अवसरको रूपमा लिन्छ।"},{id:16,q:"सिर्जनात्मक चिन्तन विकास गर्ने उपाय कुन हो?",options:["परम्परागत कोणबाट मात्र सोच्ने","नकारात्मक सोच राख्ने","योग र ध्यान मार्फत मस्तिष्क एकाग्र बनाउने र बहुविकल्प खोज्ने","अभ्यास नगर्ने"],correct:2,expl:"योग-ध्यानले दिमाग शान्त र एकाग्र बनाउँछ, अनि बहुविकल्प (Divergent thinking) को अभ्यासले सिर्जनात्मकता बढ्छ।"},{id:17,q:"टिनको बट्टाबाट कलमदानी बनाउनु कुन चिन्तनको उदाहरण हो?",options:["समालोचनात्मक चिन्तन","सिर्जनात्मक चिन्तन (Upcycling / नवप्रवर्तन)","संवेगात्मक चिन्तन","360 डिग्री प्रतिक्रिया"],correct:1,expl:"फोहोर वा काम नलाग्ने वस्तुलाई नयाँ उपयोगी वस्तुमा परिणत गर्नु सिर्जनात्मक चिन्तन र नवप्रवर्तनको उत्कृष्ट उदाहरण हो।"},{id:18,q:"10 वर्षपछिको विश्वको कथा लेख्न लगाउनुले विद्यार्थीमा के विकास हुन्छ?",options:["सूचना भण्डारण क्षमता","तार्किक विश्लेषण मात्र","अनन्त कल्पनाशीलता र नवप्रवर्तन क्षमता","इतिहास सम्झने क्षमता"],correct:2,expl:"भविष्यको कल्पना गर्नुले कल्पनाशीलता र नवप्रवर्तनको अभ्यास हुन्छ, जुन सिर्जनात्मकताको मुख्य आधार हो।"},{id:19,q:"सिर्जनात्मक र समालोचनात्मक चिन्तनको सम्बन्ध कस्तो छ?",options:["यी दुई पूर्ण विरोधी हुन्","सिर्जनात्मकले विचार उत्पन्न गर्छ (Divergent) भने समालोचनात्मकले जाँच्छ (Convergent)","एक बिना पनि अर्को पूर्ण हुन्छ","दुवै भूतकालसँग मात्र सम्बन्धित छन्"],correct:1,expl:"सिर्जनात्मक चिन्तनले धेरै विकल्प जन्माउँछ (Divergent), समालोचनात्मकले ती विकल्पमध्ये उत्तम छान्छ (Convergent)। दुवै एकसाथ चाहिन्छ।"},{id:20,q:"'सिर्जनात्मक चिन्तन उत्पादक हो भने समालोचनात्मक चिन्तन परिशोधक हो' भन्ने भनाइ कस्तो हो?",options:["गलत","आंशिक सही","पूर्ण सही","सम्बन्धित नै छैन"],correct:2,expl:"सिर्जनात्मकले नयाँ उत्पादन गर्छ, समालोचनात्मकले त्यसलाई परिष्कृत/शुद्ध बनाउँछ - त्यसैले यो भनाइ पूर्ण सही हो।"},{id:21,q:"सुबोध र फुलैया संवादमा सिर्जनात्मकता कसरी सिक्न सकिन्छ भनिएको छ?",options:["कडा परीक्षा दिएर मात्र","दैनिक व्यवहारमा निरन्तर अभ्यास र प्रयोग गरेर","महँगो विद्यालयमा पढेर मात्र","प्रविधि प्रयोग नगरेर"],correct:1,expl:"पाठ अनुसार सिर्जनात्मकता किताबबाट मात्र होइन, दैनिक जीवनका साना समस्या समाधान गर्ने अभ्यासबाटै विकास हुन्छ।"},{id:22,q:"पठाओ / टुटल जस्ता एपहरू कुन चिन्तनको उपज हुन्?",options:["शास्त्रीय चिन्तन","परम्परागत चिन्तन","सिर्जनात्मक चिन्तन र नवप्रवर्तन","सहानुभूति चिन्तन मात्र"],correct:2,expl:"ट्राफिक र यातायातको पुरानो समस्यालाई एप मार्फत समाधान गर्नु
