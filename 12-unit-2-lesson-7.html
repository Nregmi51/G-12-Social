ाइ, वर्गीकरण, रुजु र व्यवस्थित गर्ने पहिलो चरणलाई तथ्याङ्क तयारी (Data Preparation) भनिन्छ। यस अन्तर्गत अनावश्यक तथ्याङ्कहरू हटाइन्छ र शङ्कास्पद तथ्याङ्कलाई पुनःपुष्टि गरिन्छ।"},{q:"(ख) तथ्याङ्क विश्लेषण चरणलाई किन सबैभन्दा महत्त्वपूर्ण चरण भनिएको हो?",a:"तथ्याङ्क विश्लेषण चरणलाई सबैभन्दा महत्त्वपूर्ण मानिनुको कारण यस चरणमा प्रशोधित तथ्याङ्कहरूको गहिरो अध्ययन गरी त्यसको वास्तविक अर्थ निकालिन्छ। यस विना सङ्कलन गरिएका तथ्याङ्कहरू केवल निर्जीव सङ्ख्या वा अक्षर मात्र रहन्छन्। विश्लेषणले नै अनुसन्धानका प्रश्नहरूको सही जवाफ दिन्छ र ठोस निष्कर्षमा पुग्न सघाउँछ।"},{q:"(ग) कुनै दुई गुणात्मक तथ्याङ्क प्रशोधन गर्ने कम्प्युटर सफ्टवेयरको नाम उल्लेख गर्नुहोस्।",a:"गुणात्मक तथ्याङ्क प्रशोधन गर्ने दुई सफ्टवेयरहरू: १. ATLAS.ti  २. NVivo"},{q:"(घ) शाब्दिक प्रस्तुतीकरण भनेको के हो?",a:"अनुसन्धानबाट प्राप्त नतिजा, निष्कर्ष वा सूचनाहरूलाई बुझ्न सजिलो हुने गरी शब्द, वाक्य वा अनुच्छेदहरूको प्रयोग गरेर लिखित वा मौखिक रूपमा व्याख्या गर्ने विधिलाई शाब्दिक प्रस्तुतीकरण भनिन्छ।"},{q:"(ङ) तथ्याङ्क सङ्कलनपछि गर्नुपर्ने कार्यहरू अझ महत्त्वपूर्ण हुन्छन्। यस भनाइलाई तर्कसहित पुष्टि गर्नुहोस्।",a:"तथ्याङ्क सङ्कलन गर्नु अनुसन्धानको सुरुवात मात्र हो। सङ्कलनपछि गरिने कार्यहरू जस्तै— तथ्याङ्क तयारी, प्रशोधन, विश्लेषण, भण्डारण र नतिजा प्रबोधिकरण नभएसम्म अनुसन्धान पूरा हुँदैन। सफाइ नगरिए नतिजा गलत आउँछ, प्रशोधन/विश्लेषण नगरिए कच्चा तथ्याङ्कबाट निष्कर्ष निस्कँदैन, र प्रबोधिकरण नगरिए ज्ञान लक्षित वर्गसम्म पुग्दैन। त्यसैले सङ्कलनपछिका कार्यहरू अझ बढी जिम्मेवार र महत्त्वपूर्ण हुन्छन्।"},{q:"(च) शाब्दिक प्रस्तुतीकरणलाई प्रभावकारी बनाउने कुनै पाँच उपायहरू उल्लेख गर्नुहोस्।",a:'१. छोटा र स्पष्ट वाक्य प्रयोग गर्ने। २. "धेरै/थोरै" को सट्टा सङ्ख्या/प्रतिशत उल्लेख गर्ने। ३. आलङ्कारिक भाषा नभई सरल र सीधा भाषा प्रयोग गर्ने। ४. एउटै कुरा दोहोर्याएर नलेख्ने। ५. व्यक्तिगत भावना नदेखाई तथ्यपरक र निष्पक्ष लेख्ने।'},{q:"(छ) चित्रात्मक प्रस्तुतीकरणका कुनै पाँच प्रकारहरू उल्लेख गरी प्रत्येकको एक एक फाइदा उल्लेख गर्नुहोस्।",a:"१. फ्लोचार्ट: जटिल प्रक्रियालाई चरणबद्ध बुझाउन मद्दत। २. सङ्गठन चार्ट: पदसोपान र तहगत संरचना छोटोमा स
