",a:"नेपाली समाज एक बहुधार्मिक समाज हो, जहाँ हिन्दू, बौद्ध, किराँत, इस्लाम, इसाई आदि विभिन्न धर्मावलम्बीहरू मिलेर बस्छन्।"},{id:"p1-q10",number:10,q:"सामाजिक विविधताको एउटा सकारात्मक पक्ष लेख्नुहोस्।",a:"यसले समाजमा सांस्कृतिक आदानप्रदान बढाउँछ र फरक दृष्टिकोण तथा ज्ञानको प्रवर्द्धन गरी सामाजिक सिकाइलाई समृद्ध बनाउँछ।"},{id:"p1-q11",number:11,q:"सामाजिक विविधताको एउटा चुनौती लेख्नुहोस्।",a:"विविध समूहहरूबीच उचित समन्वय र नीतिगत व्यवस्था हुन नसकेमा सामाजिक असमझदारी, विभेद र सांस्कृतिक द्वन्द्व सिर्जना हुन सक्ने चुनौती रहन्छ।"},{id:"p1-q12",number:12,q:"विविधताको समन्वय किन आवश्यक छ?",a:"समाजमा आपसी मेलमिलाप, सहअस्तित्व, दिगो शान्ति र राष्ट्रिय एकता मजबुत बनाउनका लागि सामाजिक विविधताको समन्वय आवश्यक छ।"},{id:"p1-q13",number:13,q:"विविधतामा एकताको एउटा उदाहरण दिनुहोस्।",a:"नेपालमा फरक-फरक जातजाति, भाषा र धर्मका मानिसहरू भए तापनि देशमा आउने प्राकृतिक विपत्ति वा राष्ट्रिय संकटको समयमा सबै नेपालीहरू एकजुट भएर सहकार्य गर्नु यसको उत्कृष्ट उदाहरण हो।"},{id:"p1-q14",number:14,q:"नेपाललाई बहुजातीय देश किन भनिन्छ?",a:"नेपालको भौगोलिक क्षेत्रभित्र १४२ भन्दा बढी जातजातिका मानिसहरू परापूर्वकालदेखि आफ्नो छुट्टै पहिचानसहित आपसी सद्भावका साथ बसोबास गर्ने भएकाले यसलाई बहुजातीय देश भनिएको हो।"},{id:"p1-q15",number:15,q:"विश्वीकरणले सामाजिक विविधतामा कस्तो प्रभाव पारेको छ?",a:"विश्वीकरणले विश्वका विविध संस्कृति र कलालाई विश्वव्यापी सञ्चारमार्फत नजिक ल्याएको छ भने अर्कोतर्फ पश्चिमा संस्कृतिको प्रभावले स्थानीय र मौलिक सामाजिक विविधताहरू लोप हुने खतरा बढाएको छ।"}]},{id:"path2",emoji:"\uD83E\uDD1D",title:"पाठ २: सामाजिक सम्बन्धहरूको विकास र सामाजिक अन्तरनिर्भरता",subtitle:"15 प्रश्नहरू • गार्हपत्य, विदथ, जनपद, अन्तरनिर्भरता",questions:[{id:"p2-q1",number:1,q:"सामाजिक सम्बन्ध भनेको के हो?",a:"समाजमा बसोबास गर्ने व्यक्ति, समूह वा संस्थाहरूबीच दैनिक रूपमा हुने अन्तरक्रिया, आपसी सम्पर्क र भावनात्मक तथा व्यावहारिक जोडलाई सामाजिक सम्बन्ध भनिन्छ।"},{id:"p2-q2",number:2,q:"सामाजिक अन्तरनिर्भरता भन्नाले के बुझिन्छ?",a:"मानव जीवनका विविध आवश्यकताहरू (आर्थिक, सामाजिक, सांस्कृतिक) एक्लै पूरा गर्न नसकिने हुनाले व्यक्ति, समाज वा राष्ट्रहरू एकअर्काको सहयोगमा भर पर्नुपर्ने अवस्थालाई सामाजिक अन्तरनिर्भरता भनिन्छ।"},{id:"p2-q3",number:3,q:"गार्हपत्य भन्नाले के बुझिन्छ?",a:"वैदिक संहिता (अथर्ववेद) अनुसार दाम्पत्य जीवन र परिवारको अस्तित्वलाई स्वीकार गरी बनेको समाजको सबैभन्दा पुरानो पारिवारिक सङ्गठन वा गृहस्थ व्यवस्थालाई गार्हपत्य भनिन्छ।"},{id:"p2-q4",number:4,q:"आहवनीय भन्नाले के बुझिन्छ?",a:"वैदिक कालमा पारिवारिक सङ्गठन (गार्हपत्य) को विकासपछि बनेको ग्राम सङ्गठन वा सामूहिक हितका लागि निर्णय गर्ने स्थानीय सामाजिक संस्थालाई आहवनीय भनिन्छ।"},{id:"p2-q5",number:5,q:"विदथ भन्नाले के बुझिन्छ?",a:"ऋग्वेदमा उल्लेख भएको महिला र पुरुष दुवै समान रूपमा सहभागी भई पारिवारिक, धार्मिक र युद्धको तयारी जस्ता विषयमा विचार-विमर्श गर्ने प्राचीनतम सामाजिक संस्था वा सभालाई विदथ भनिन्छ।"},{id:"p2-q6",number:6,q:"जनपद भन्नाले के बुझिन्छ?",a:"प्राचीन वैदिक कालमा धेरै वटा ग्रामहरू (गाउँहरू) मिलेर बनेको ठुलो भौगोलिक, सामाजिक तथा राजनीतिक प्रशासनिक एकाइलाई जनपद भनिन्छ।"},{id:"p2-q7",number:7,q:"ग्राम भन्नाले के बुझिन्छ?",a:"प्राचीन कालमा धेरै वटा कुल वा परिवारहरू मिलेर बनेको सामूहिक बसोबासको क्षेत्र वा गाउँलाई ग्राम भनिन्छ।"},{id:"p2-q8",number:8,q:"कुल भन्नाले के बुझिन्छ?",a:"रगतको नाता, वंश वा एउटै पुर्खाका आधारमा बनेको सामाजिक संरचनाको सबैभन्दा सानो र आधारभूत एकाइ (परिवार) लाई कुल भनिन्छ।"},{id:"p2-q9",number:9,q:"कुटुम्ब भन्नाले के बुझिन्छ?",a:"एउटै कुल वा वंशसँग वैवाहिक सम्बन्ध वा अन्य नाताका आधारमा जोडिएका नातेदार तथा हितैषीहरूको विस्तृत सामाजिक सञ्जाललाई कुटुम्ब भनिन्छ।"},{id:"p2-q10",number:10,q:"व्यक्ति र समाजको सम्बन्ध कस्तो हुन्छ?",a:"व्यक्ति र समाजको सम्बन्ध अन्योन्याश्रित वा परिपूरक हुन्छ; व्यक्ति विना समाजको र समाज विना व्यक्तिको विकास र अस्तित्व सम्भव हुँदैन।"},{id:"p2-q11",number:11,q:"सामाजिक सम्बन्धको एउटा उदाहरण दिनुहोस्।",a:"छिमेकीहरूबीच सुख-दुःखमा सरसहयोग आदानप्रदान हुनु वा विवाह र चाडपर्वमा एकजुट हुनु सामाजिक सम्बन्धको उदाहरण हो।"},{id:"p2-q12",number:12,q:"सामाजिक अन्तरनिर्भरताको एउटा उदाहरण दिनुहोस्।",a:"गाउँका किसानले उत्पादन गरेको खाद्यान्न सहरका मानिसले उपभोग गर्नु र सहरमा उत्पादित रासायनिक मल तथा औजारहरू गाउँका किसानले प्रयोग गर्नु सामाजिक अन्तरनिर्भरता हो।"},{id:"p2-q13",number:13,q:"प्राचीन सामाजिक संरचनाको एउटा विशेषता लेख्नुहोस्।",a:"प्राचीन सामाजिक संरचना सामूहिक स्वामित्व, बलियो पारिवारिक अनुशासन र परम्परागत नैतिक मूल्य मान्यतामा आधारित थियो।"},{id:"p2-q14",number:14,q:"आधुनिक सामाजिक संरचनाको एउटा विशेषता लेख्नुहोस्।",a:"आधुनिक सामाजिक संरचना अत्यधिक प्रविधिमैत्री, जटिल, वैयक्तिकतावादी र विश्वव्यापी अन्तरनिर्भरतामा आधारित छ।"},{id:"p2-q15",number:15,q:"वैयक्तिकतावादी दृष्टिकोण भनेको के हो?",a:"समाज वा समूहको तुलनामा व्यक्ति, उसको व्यक्तिगत स्वतन्त्रता, निजी अधिकार, र स्वार्थलाई सर्वोपरि प्राथमिकता दिने विचारलाई वैयक्तिकतावादी दृष्टिकोण भनिन्छ।"}]},{id:"path3",emoji:"\uD83D\uDD49️",title:"पाठ ३: पूर्वीय र पाश्चात्य दर्शन",subtitle:"15 प्रश्नहरू • दर्शन, विश्वदृष्टिकोण, पूर्वीय vs पाश्चात्य",questions:[{id:"p3-q1",number:1,q:"दर्शन भन्नाले के बुझिन्छ?",a:"संस्कृतको 'दृश्' धातुबाट बनेको दर्शनको शाब्दिक अर्थ 'हेर्नु वा साक्षात्कार गर्नु' हुन्छ, जसले जीवन, जगत्, सत्य र सृष्टिको उत्पत्तिको बारेमा गरिने तार्किक एवं गहिरो विवेचनालाई बुझाउँछ।"},{id:"p3-q2",number:2,q:"विश्वदृष्टिकोण भन्नाले के बुझिन्छ?",a:"आफ्नो ज्ञान, अनुभव, धर्म र दर्शनका आधारमा यो भौतिक संसार र जीवनलाई हेर्ने, बुझ्ने र विश्लेषण गर्ने व्यक्तिको समग्र बुझाइ वा दृष्टिकोणलाई विश्वदृष्टिकोण भनिन्छ।"},{id:"p3-q3",number:3,q:"पूर्वीय दर्शनको एउटा विशेषता लेख्नुहोस्।",a:"यसले अध्यात्म, आन्तरिक शान्ति, आत्मसाक्षात्कार, र सामूहिक कल्याण ('वसुधैव कुटुम्बकम्') मा बढी जोड दिन्छ।"},{id:"p3-q4",number:4,q:"पाश्चात्य दर्शनको एउटा विशेषता लेख्नुहोस्।",a:"यसले भौतिकवाद, वैज्ञानिक तर्क, अनुभववाद, व्यक्तिगत स्वतन्त्रता र प्रमाणमुखी विश्लेषणमा जोड दिन्छ।"},{id:"p3-q5",number:5,q:"पूर्वीय दर्शनको एउटा उदाहरण दिनुहोस्।",a:"सनातन वैदिक दर्शन (षड्दर्शन जस्तै: साङ्ख्य र योग दर्शन) वा बौद्ध दर्शन पूर्वीय दर्शनका उदाहरण हुन्।"},{id:"p3-q6",number:6,q:"पाश्चात्य दर्शनको एउटा उदाहरण दिनुहोस्।",a:"प्राचीन ग्रिसका सुकरात र प्लेटोको दर्शन वा कार्ल मार्क्सको द्वन्द्वात्मक भौतिकवादी दर्शन पाश्चात्य दर्शनका उदाहरण हुन्।"},{id:"p3-q7",number:7,q:"आध्यात्मिकतामा जोड दिने दर्शन कुन हो?",a:"आध्यात्मिकता, कर्म र पुनर्जन्ममा जोड दिने दर्शन पूर्वीय दर्शन हो।"},{id:"p3-q8",number:8,q:"वैज्ञानिक तर्कमा जोड दिने दर्शन कुन हो?",a:"बाह्य प्रमाण र वैज्ञानिक तर्कमा जोड दिने दर्शन पाश्चात्य दर्शन हो।"},{id:"p3-q9",number:9,q:"सामूहिक कल्याणमा जोड दिने दर्शन कुन हो?",a:"सम्पूर्ण प्राणी र समाजको हितलाई प्राथमिकता दिने 'बहुजन हिताय, बहुजन सुखाय' को विचार बोकेको पूर्वीय दर्शन हो।"},{id:"p3-q10",number:10,q:"व्यक्तिगत स्वतन्त्रतामा जोड दिने दर्शन कुन हो?",a:"व्यक्ति र उसको नागरिक अधिकार तथा स्वतन्त्रतालाई जोड दिने दर्शन पाश्चात्य दर्शन हो।"},{id:"p3-q11",number:11,q:"पूर्वीय दर्शनको एउटा प्रमुख दार्शनिकको नाम लेख्नुहोस्।",a:"पूर्वीय दर्शनका प्रमुख दार्शनिक गौतम बुद्ध वा महर्षि कपिल हुन्।"},{id:"p3-q12",number:12,q:"पाश्चात्य दर्शनको एउटा प्रमुख दार्शनिकको नाम लेख्नुहोस्।",a:"पाश्चात्य दर्शनका प्रमुख दार्शनिक सुकरात (Socrates) वा इम्यानुएल कान्ट (Immanuel Kant) हुन्।"},{id:"p3-q13",number:13,q:"पूर्वीय र पाश्चात्य दर्शनबीचको एउटा समानता लेख्नुहोस्।",a:"दुवै दर्शनले मानव जीवनका दुःख र समस्याहरूको तार्किक समाधान खोज्ने तथा सत्यको अन्वेषण गर्ने लक्ष्य राख्छन्।"},{id:"p3-q14",number:14,q:"पूर्वीय र पाश्चात्य दर्शनबीचको एउटा भिन्नता लेख्नुहोस्।",a:"पूर्वीय दर्शन बढी अन्तर्मुखी (आन्तरिक चिन्तन र आत्मज्ञान) छ भने पाश्चात्य दर्शन बढी बहिर्मुखी (बाह्य भौतिक संसारको अनुसन्धान र तर्क) छ।"},{id:"p3-q15",number:15,q:"नेपाली समाजमा कुन दर्शनको प्रभाव बढी छ?",a:"नेपाली समाजमा पूर्वीय चिन्तन परम्परा (विशेष गरी सनातन हिन्दु र बौद्ध जीवन दर्शन) को प्रभाव बढी छ।"}]},{id:"path4",emoji:"⚖️",title:"पाठ ४: सामाजिक मूल्य र मान्यता",subtitle:"15 प्रश्नहरू • मूल्य, मान्यता, स्रोत, परिवर्तन",questions:[{id:"p4-q1",number:1,q:"सामाजिक मूल्य भन्नाले के बुझिन्छ?",a:"समाजका सदस्यहरूले असल, उचित, वांछनीय र महत्त्वपूर्ण मानेर अंगीकार गरेका साझा आदर्श, विश्वास र मापदण्डहरूलाई सामाजिक मूल्य भनिन्छ।"},{id:"p4-q2",number:2,q:"सामाजिक मान्यता भन्नाले के बुझिन्छ?",a:"सामाजिक मूल्यका आधारमा समाजले आफ्ना सदस्यहरूको दैनिक व्यवहार र आचरणलाई नियन्त्रित तथा निर्देशित गर्न बनाएका मूर्त नियम, रीत र अपेक्षाहरूलाई सामाजिक मान्यता भनिन्छ।"},{id:"p4-q3",number:3,q:"सामाजिक मूल्यको एउटा उदाहरण दिनुहोस्।",a:"इमानदारिता (Honesty), परोपकार, देशभक्ति वा शान्ति सामाजिक मूल्यका उदाहरण हुन्।"},{id:"p4-q4",number:4,q:"सामाजिक मान्यताको एउटा उदाहरण दिनुहोस्।",a:"ठुलालाई आदर गर्नु, गुरुको सम्मान गर्नु, वा समाजमा तोकिएका विवाह तथा सांस्कृतिक विधिहरूको पालना गर्नु सामाजिक मान्यताका उदाहरण हुन्।"},{id:"p4-q5",number:5,q:"सत्यनिष्ठा एउटा ______ हो।",a:"सामाजिक मूल्य (Social Value) हो।"},{id:"p4-q6",number:6,q:"अहिंसा एउटा ______ हो।",a:"सामाजिक मूल्य (Social Value) हो।"},{id:"p4-q7",number:7,q:"सहयोग एउटा ______ हो।",a:"सामाजिक मूल्य (Social Value) हो।"},{id:"p4-q8",number:8,q:"सम्मान एउटा ______ हो।",a:"सामाजिक मूल्य (Social Value) हो।"},{id:"p4-q9",number:9,q:"मूल्य र मान्यताबीचको एउटा भिन्नता लेख्नुहोस्।",a:"सामाजिक मूल्य अमूर्त र व्यापक आदर्श हो (जस्तै: न्याय) भने सामाजिक मान्यता त्यस आदर्शलाई व्यवहारमा लागू गर्ने मूर्त नियम हो (जस्तै: कानुनको पालना गर्नु)।"},{id:"p4-q10",number:10,q:"मूल्य र मान्यताबीचको एउटा समानता लेख्नुहोस्।",a:"दुवैले समाजलाई सुव्यवस्थित, मर्यादित र अनुशासित राख्न तथा मानव व्यवहारलाई मार्गनिर्देश गर्न महत्त्वपूर्ण भूमिका खेल्छन्।"},{id:"p4-q11",number:11,q:"सामाजिक मूल्यको एउटा स्रोत लेख्नुहोस्।",a:"सामाजिक मूल्यको प्रमुख स्रोत धर्म र दर्शन वा पारिवारिक संस्कार हो।"},{id:"p4-q12",number:12,q:"सामाजिक मान्यताको एउटा स्रोत लेख्नुहोस्।",a:"सामाजिक मान्यताको प्रमुख स्रोत परम्परा, रीतिथिति र सामाजिक कानुन हो।"},{id:"p4-q13",number:13,q:"मूल्य परिवर्तनको एउटा कारण लेख्नुहोस्।",a:"आधुनिक शिक्षाको विकास, वैचारिक चेतना र आधुनिकीकरण नै सामाजिक मूल्य परिवर्तनका मुख्य कारण हुन्।"},{id:"p4-q14",number:14,q:"मान्यता परिवर्तनको एउटा कारण लेख्नुहोस्।",a:"प्रविधिको तीव्र विकास, बसाइँसराइ र कानुनी सुधारहरू (जस्तै: जातपात र छुवाछुत विरोधी कानुन) मान्यता परिवर्तनका कारण हुन्।"},{id:"p4-q15",number:15,q:"नेपाली समाजको एउटा प्रमुख मूल्य लेख्नुहोस्।",a:"'अतिथि देवो भवः' (पाहुनालाई भगवान् सरह मान्ने परम्परा) वा 'परोपकार' नेपाली समाजको एक प्रमुख मूल्य हो।"}]},{id:"path5",emoji:"\uD83C\uDFDB️",title:"पाठ ५: सामाजिक संरचना र संस्था",subtitle:"15 प्रश्नहरू • संरचना, संस्था, प्राथमिक/द्वितीयक समूह",questions:[{id:"p5-q1",number:1,q:"सामाजिक संरचना भन्नाले के बुझिन्छ?",a:"समाजका विभिन्न अङ्गहरू जस्तै: व्यक्ति, समूह, वर्ग, परिस्थिति (Status), भूमिका र संस्थाहरूबीचको अपेक्षाकृत स्थायी र व्यवस्थित अन्तरसम्बन्धको सञ्जाललाई सामाजिक संरचना भनिन्छ।"},{id:"p5-q2",number:2,q:"सामाजिक संस्था भन्नाले के बुझिन्छ?",a:"समाजको आधारभूत आवश्यकताहरू पूरा गर्न र सामाजिक व्यवहारलाई नियमित एवं सुव्यवस्थित गर्न स्थापित भएका स्वीकृत नियम, कार्यप्रणाली र सङ्गठनहरूको समष्टिलाई सामाजिक संस्था भनिन्छ।"},{id:"p5-q3",number:3,q:"सामाजिक संरचनाको एउटा उदाहरण दिनुहोस्।",a:"जाति प्रथा (Caste System), वर्ग व्यवस्था वा परिवारभित्रको नातासम्बन्धको संरचना सामाजिक संरचनाका उदाहरण हुन्।"},{id:"p5-q4",number:4,q:"सामाजिक संस्थाको एउटा उदाहरण दिनुहोस्।",a:"परिवार (Family), विद्यालय वा धर्म सामाजिक संस्थाका उत्कृष्ट उदाहरण हुन्।"},{id:"p5-q5",number:5,q:"परिवार एउटा ______ हो।",a:"सामाजिक संस्था (Social Institution) हो।"},{id:"p5-q6",number:6,q:"विद्यालय एउटा ______ हो।",a:"सामाजिक संस्था (शैक्षिक संस्था) हो।"},{id:"p5-q7",number:7,q:"धर्म एउटा ______ हो।",a:"सामाजिक संस्था हो।"},{id:"p5-q8",number:8,q:"राज्य एउटा ______ हो।",a:"सामाजिक संस्था (राजनीतिक संस्था) हो।"},{id:"p5-q9",number:9,q:"सामाजिक संरचनाको एउटा तत्त्व लेख्नुहोस्।",a:"सामाजिक परिस्थिति र भूमिका (Status and Role) सामाजिक संरचनाको एक महत्त्वपूर्ण तत्त्व हो।"},{id:"p5-q10",number:10,q:"सामाजिक संस्थाको एउटा तत्त्व लेख्नुहोस्।",a:"सामाजिक मूल्य र नियमहरू (Rules and Norms) सामाजिक संस्थाको आधारभूत तत्त्व हो।"},{id:"p5-q11",number:11,q:"प्राथमिक समूहको एउटा उदाहरण दिनुहोस्।",a:"परिवार (Family) वा बालसखा साथीहरूको समूह (Peer Group) प्राथमिक समूहको उदाहरण हो।"},{id:"p5-q12",number:12,q:"द्वितीयक समूहको एउटा उदाहरण दिनुहोस्।",a:"राजनीतिक दल, बैंक वा व्यापारिक सङ्गठनहरू द्वितीयक समूहका उदाहरण हुन्।"},{id:"p5-q13",number:13,q:"औपचारिक संस्थाको एउटा उदाहर
