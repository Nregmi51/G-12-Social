निसलाई कुनै पनि कुरा आँखा चिम्लेर विश्वास गर्नुको साटो तथ्य र तर्कका आधारमा बुझ्न सघाउँछ।"},{q:"(ख) समालोचनात्मक चिन्तनअन्तर्गतका सिपहरूमध्ये तपाईंलाई कुन सबैभन्दा महत्त्वपूर्ण लाग्छ? एक कारण दिनुहोस्।",a:"मलाई 'आत्मनियमन सिप (Self-regulation Skill)' सबैभन्दा महत्त्वपूर्ण लाग्छ। कारण: किनकि यस सिपले व्यक्तिलाई आफ्नो सोच्ने तरिका, दृष्टिकोण र निर्णयहरू सही छन् कि छैनन् भनी निरन्तर आफैँले अनुगमन र मूल्याङ्कन गर्ने अवसर दिन्छ, जसले गर्दा मानिसले आफ्ना गल्तीहरू समयमै सच्याएर सही मार्ग पहिचान गर्न सक्छ।",hl:!0},{q:"(ग) आत्मआलोचनालाई परिभाषित गर्नुहोस्।",a:"व्यक्तिले आफ्ना सबल र कमजोर पक्षहरूलाई निष्पक्ष रूपमा पहिचान गरी, आफ्ना कमजोरीहरूलाई महसुस गर्दै तिनलाई सहजै स्वीकार गर्ने र आगामी दिनमा सच्याउने प्रतिबद्धता जनाउने क्षमतालाई आत्मआलोचना भनिन्छ।"},{q:"(घ) आत्मआलोचना र स्वरूपान्तरणबिच के सम्बन्ध छ? छोटकरीमा लेख्नुहोस्।",a:"आत्मआलोचना र स्वरूपान्तरणबिच कार्यकारण (प्रस्थानबिन्दु र परिणामको) सम्बन्ध छ। आत्मआलोचना पहिलो चरण वा प्रस्थानबिन्दु हो भने स्वरूपान्तरण त्यसको अन्तिम परिणाम हो। जबसम्म व्यक्तिले आफ्ना कमजोरीहरू महसुस गरी 'आत्मआलोचना' गर्दैन, तबसम्म उसले आफूभित्र सकारात्मक परिवर्तन वा 'स्वरूपान्तरण' ल्याउन सक्दैन। त्यसैले स्वरूपान्तरण प्राप्त गर्नका लागि आत्मआलोचना अनिवार्य सर्त हो।"},{q:"(ङ) समालोचनात्मक चिन्तनको महत्त्वलाई पाँच बुँदामा लेख्नुहोस्।",a:"१. यसले कुनै पनि समस्या वा मुद्दाको वास्तविक र निष्पक्ष निष्कर्षमा पुग्न मद्दत गर्दछ। २. व्यक्तिमा रहेका पूर्वाग्रह, भ्रम र पक्षधरताहरू हटाई तथ्यमा आधारित निर्णय लिन सघाउँछ। ३. जीवनमा आइपर्ने अप्रत्याशित समस्याहरूलाई बुद्धिमानीपूर्वक समाधान गर्न मद्दत पुग्छ। ४. सान्दर्भिक तथ्य र प्रमाणहरूलाई मात्र स्वीकार गरी असान्दर्भिक कुराहरूलाई हटाउन सघाउँछ। ५. अरूको फरक दृष्टिकोण र विचारलाई बुझ्न र आत्मसात गर्न सहयोग पुग्छ।",list:!0},{q:"(च) समालोचनात्मक चिन्तनमा प्रयोग हुने सिपहरूको सूची बनाउनुहोस्।",a:"१. विश्लेषण सिप (Analysis Skill) २. अर्थ निर्माण सिप (Meaning Making Skill) ३. निष्कर्ष अनुमान गर्ने सिप (Inference Skill) ४. व्याख्या गर्ने सिप (Explanation Skill) ५. आत्मनियमन सिप (Self-regulation) ६. खुला सोच्ने सिप (Open-minded
